/* ---------- GROCERY LIST ----------
   One line per ingredient. Matching ignores plurals and descriptions ("extra virgin olive oil" and
   "olive oil" are the same item), and quantities are added up across the whole plan, converting
   between compatible units (kg/g, l/ml, and tsp/tbsp/cup into ml). */
const VOL_ML = {ml:1, l:1000, tsp:5, tbsp:20, cup:250};
const MASS_G = {g:1, kg:1000};
const NAME_DROP = new Set(['extra','virgin','large','medium','small','fresh','ripe','raw','plain','unsalted','salted',
  'softened','cubed','chopped','diced','minced','sliced','grated','coarsely','finely','pkg','package','clove','cloves',
  'boiling','warm','hot','cold','iced']);
// grams per millilitre, used only to merge a weight and a volume of the same ingredient
const DENSITY = {water: 1, butter: 0.95};
const LIQUID_RE = /\b(oil|vinegar|broth|stock|water|milk|juice|sauce|syrup|wine|cream|extract|molasse|honey|coffee|espresso)/;

function topName(raw){
  // text before the first comma, ignoring commas inside brackets: "seeds (pepita, sunflower), toasted" -> "seeds (pepita, sunflower)"
  const masked = String(raw || '').replace(/\([^)]*\)/g, m => m.replace(/,/g, '\u0001'));
  return masked.split(',')[0].replace(/\u0001/g, ',').trim();
}
function singularWord(w){
  if(w.length > 3 && w.endsWith('ies')) return w.slice(0, -3) + 'y';
  if(w.length > 4 && (/(ch|sh|x|z)es$/.test(w) || /oes$/.test(w))) return w.slice(0, -2);
  if(w.length > 3 && w.endsWith('s') && !/(ss|us|is)$/.test(w)) return w.slice(0, -1);
  return w;
}
function normIngName(raw){
  const base = String(raw || '').toLowerCase().replace(/\([^)]*\)/g, ' ').split(',')[0].replace(/[^a-z\s-]/g, ' ');
  const words = base.split(/\s+/).filter(Boolean).filter(w => !NAME_DROP.has(w)).map(singularWord);
  return words.join(' ') || String(raw || '').trim().toLowerCase();
}

function parseQty(q){
  if(q === null || q === undefined) return NaN;
  let s = String(q).trim().toLowerCase();
  if(!s) return NaN;
  const uni = {'½':'1/2', '¼':'1/4', '¾':'3/4', '⅓':'1/3', '⅔':'2/3', '⅛':'1/8'};
  s = s.replace(/[½¼¾⅓⅔⅛]/g, m => ' ' + uni[m] + ' ').replace(/\s+/g, ' ').trim();
  const range = s.match(/^(.+?)\s*(?:-|–|to)\s*(.+)$/);
  if(range){
    const a = parseQty(range[1]), b = parseQty(range[2]);
    if(!isNaN(a) && !isNaN(b)) return Math.max(a, b);
  }
  let m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/);
  if(m) return +m[1] + (+m[2]) / (+m[3]);
  m = s.match(/^(\d+)\/(\d+)$/);
  if(m) return (+m[1]) / (+m[2]);
  if(/^\d*\.?\d+$/.test(s)) return parseFloat(s);
  return NaN;
}

function fmtNum(n){ return String(Math.round(n * 100) / 100); }
function fmtFrac(n){
  const whole = Math.floor(n + 1e-9), f = n - whole;
  if(f < 0.03) return String(whole);
  if(f > 0.97) return String(whole + 1);
  const fr = [[0.25,'¼'], [0.5,'½'], [0.75,'¾'], [1/3,'⅓'], [2/3,'⅔']];
  for(const [v, c] of fr){ if(Math.abs(f - v) < 0.03) return (whole || '') + c; }
  return fmtNum(n);
}

function formatVolume(ml, metric){
  if(metric){
    if(ml >= 1000) return fmtNum(roundMl(ml) / 1000) + ' l';
    return roundMl(ml) + ' ml';
  }
  if(ml < 20) return fmtFrac(ml / 5) + ' tsp';
  if(ml <= 60.5) return fmtFrac(ml / 20) + ' tbsp';
  return fmtFrac(ml / 250) + ' cup';
}

/* ---------- AUSTRALIAN NAMES, SIZE-LAST NAMES, LIQUIDS IN ML ---------- */
const AU_NAMES = [
  [/\bveggie ground\b/i, 'veggie mince'], [/\bbell peppers?\b/i, m => 'capsicum' + (/s$/i.test(m) ? 's' : '')],
  [/\barugula\b/i, 'rocket'], [/\byellow onions?\b/i, m => 'brown onion' + (/s$/i.test(m) ? 's' : '')],
  [/\bcilantro\b/i, 'coriander'], [/\b(?:scallions?|green onions?)\b/i, m => 'spring onion' + (/s$/i.test(m) ? 's' : '')],
  [/\bground (beef|turkey|pork|chicken|lamb)\b/i, (m, a) => a.toLowerCase() + ' mince'],
  [/\bshrimps?\b/i, 'prawns'], [/\ball[- ]purpose flour\b/i, 'plain flour'], [/\bself[- ]rising flour\b/i, 'self-raising flour'],
  [/\bcorn ?starch\b/i, 'cornflour'], [/\bbaking soda\b/i, 'bicarbonate of soda'],
  [/\b(?:powdered|confectioners'?) sugar\b/i, 'icing sugar'], [/\bgranulated sugar\b/i, 'white sugar'],
  [/\bheavy (?:whipping )?cream\b/i, 'thickened cream'], [/\bbroth\b/i, 'stock'], [/\bketchup\b/i, 'tomato sauce'],
  [/\bcanned\b/i, 'tinned'], [/\bchilies\b/i, 'chillies'], [/\bchil(?:i|e)(s?)\b/i, (m, s) => 'chilli' + s],
  [/\bred pepper flakes\b/i, 'chilli flakes'], [/\bnapa cabbage\b/i, 'wombok'], [/\bromaine(?: lettuce)?\b/i, 'cos lettuce'],
  [/\bgarbanzo beans?\b/i, 'chickpeas'], [/\bwhole[- ]wheat\b/i, 'wholemeal'], [/\bcookies\b/i, 'biscuits'],
  [/\bswiss chard\b/i, 'silverbeet'], [/\brutabaga\b/i, 'swede']
];
function auName(name){
  let out = String(name || '');
  AU_NAMES.forEach(([re, to]) => {
    out = out.replace(new RegExp(re.source, 'gi'), (...a) => {
      const m = a[0];
      let r = typeof to === 'function' ? to(...a) : to;
      if(/^[A-Z]/.test(m)) r = /\s[A-Z]/.test(m) ? r.replace(/\b([a-z])/g, c => c.toUpperCase()) : r.charAt(0).toUpperCase() + r.slice(1);
      return r;
    });
  });
  // "spring onions (scallions)" would now read "spring onions (spring onions)": drop the repeat
  out = out.replace(/([a-z][a-z ]*?)\s*\(\1\)/ig, '$1');
  return out;
}
function sizeLast(name){
  const str = String(name || '');
  const m = str.match(/^(extra[- ]large|large|medium|small|big)\s+(?!\()(.+)$/i);
  if(!m) return name;
  const size = m[1].toLowerCase().replace('-', ' ');
  let rest = m[2].trim(), label = size;
  const pk = rest.match(/^(heads?|bunch(?:es)?|pkg|package|cans?|jars?)\s+(.+)$/i);   // "small bunch cilantro" -> "Cilantro (small bunch)"
  if(pk){ label = size + ' ' + pk[1].toLowerCase(); rest = pk[2].trim(); }
  // keep any ", chopped" style note after the size: "Onion, diced" -> "Onion (large), diced"
  const masked = rest.replace(/\([^)]*\)/g, x => x.replace(/,/g, '\u0001'));
  const ci = masked.indexOf(',');
  const item = (ci < 0 ? rest : rest.slice(0, ci)).trim(), tail = ci < 0 ? '' : rest.slice(ci);
  const out = item + ' (' + label + ')' + tail;
  return out.charAt(0).toUpperCase() + out.slice(1);
}
function isLiquidName(name){ const l = String(name || '').toLowerCase(); return LIQUID_RE.test(l) && !/\b(cheese|powder|flakes|paste|zest|butter)\b/.test(l); }
function normalizeIngredient(ing){
  const out = {...ing};
  out.name = sizeLast(auName(ing.name));
  const u = String(ing.unit || '').trim().toLowerCase();
  const per = {ml:1, l:1000, tsp:5, tbsp:20, cup:250}[u];
  const q = String(ing.qty === undefined || ing.qty === null ? '' : ing.qty).trim();
  if(per && q && !/[-–]|\bto\b/i.test(q) && (u === 'ml' || u === 'l' || isLiquidName(out.name))){
    const n = parseQty(q);
    if(!isNaN(n) && n > 0){ out.qty = String(Math.round(n * per * 10) / 10); out.unit = 'ml'; }
  }
  return out;
}
// shown quantity + unit: stored millilitres read as tsp under 20 ml, tbsp up to 60 ml, plain ml above that
function ingQtyText(qty, unit, f){
  const u = String(unit || '').trim().toLowerCase();
  if(u === 'ml'){
    const n = parseQty(qty);
    if(!isNaN(n)){
      const ml = n * (f || 1);
      if(ml < 20) return fmtFrac(ml / 5) + ' tsp';
      if(ml <= 60.5) return fmtFrac(ml / 20) + ' tbsp';
      return roundMl(ml) + ' ml';
    }
  }
  return [scaleQty(qty, u, f), unit].filter(Boolean).join(' ');
}

function groceryKey(norm){ return norm.replace(/[.$#\[\]\/]/g, '_'); }
function buildGroceryList(planArg){
  const groups = {};
  const bplan = planArg || activePlan();
  const carried = (bplan && bplan.carried) || [];
  planRecipes(bplan).forEach(recipe=>{
    const factor = scaleFactorFor(recipe, bplan);
    const isCarried = carried.includes(recipe.id);
    (recipe.ingredients || []).forEach(ing=>{
      const raw = (ing.name || '').trim();
      if(!raw) return;
      const norm = normIngName(raw);
      if(isCarried && (bplan.carryMode === 'none' || (bplan.skipIng || []).includes(groceryKey(norm)))) return;
      const g = groups[norm] || (groups[norm] = {norm, names:{}, g:0, hasG:false, ml:0, hasMl:false, metricVol:false, count:0, hasCount:false, others:{}, notes:[], cats:{}, uses:[]});
      const shown = topName(raw);
      g.names[shown] = (g.names[shown] || 0) + 1;
      const ck = CAT_KEYS.includes(ing.category) ? ing.category : guessCategory(raw);
      g.cats[ck] = (g.cats[ck] || 0) + 1;
      const unit = (ing.unit || '').trim().toLowerCase();
      const rawQ = String(ing.qty === undefined || ing.qty === null ? '' : ing.qty).trim();
      const qty = parseQty(rawQ) * factor;
      if(!g.uses.some(u => u.id === recipe.id)) g.uses.push({id: recipe.id, title: recipe.title, text: [rawQ ? ingQtyText(rawQ, unit, factor) : '', raw].filter(Boolean).join(' ')});
      if(isNaN(qty)){ if(rawQ && !g.notes.includes(rawQ)) g.notes.push(rawQ); return; }
      if(MASS_G[unit]){ g.g += qty * MASS_G[unit]; g.hasG = true; }
      else if(VOL_ML[unit]){
        g.ml += qty * VOL_ML[unit]; g.hasMl = true;
        if(unit === 'ml' || unit === 'l') g.metricVol = true;
      }
      else if(unit === ''){ g.count += qty; g.hasCount = true; }
      else { g.others[unit] = (g.others[unit] || 0) + qty; }
    });
  });

  return Object.values(groups).map(g=>{
    // merge a weight and a volume of the same thing where the conversion is well known
    if(g.hasG && g.hasMl && DENSITY[g.norm]){
      if(g.norm === 'water'){ g.ml += g.g / DENSITY.water; g.g = 0; g.hasG = false; g.metricVol = true; }
      else { g.g += g.ml * DENSITY[g.norm]; g.ml = 0; g.hasMl = false; }
    }
    const parts = [];
    if(g.hasG) parts.push(g.g >= 1000 ? fmtNum(g.g / 1000) + ' kg' : Math.round(g.g) + ' g');
    if(g.hasMl) parts.push(formatVolume(g.ml, g.metricVol || LIQUID_RE.test(g.norm)));
    if(g.hasCount) parts.push(fmtFrac(g.count));
    Object.keys(g.others).forEach(u => parts.push(fmtNum(g.others[u]) + ' ' + u));
    // display name: the most common wording; on a tie use the plural form for counts above one
    const plural = g.hasCount && g.count > 1;
    const name = Object.keys(g.names).sort((a,b)=> g.names[b] - g.names[a] || (plural ? b.length - a.length : a.length - b.length))[0];
    const cat = CAT_KEYS.slice().sort((a,b)=> (g.cats[b]||0) - (g.cats[a]||0))[0];
    return {key: groceryKey(g.norm), name, qtyText: parts.join(' + '), note: g.notes.join(', '), cat, extra: false, uses: g.uses};
  }).sort((a,b)=>a.name.localeCompare(b.name));
}

function allGroceryItems(){
  const plan = activePlan();
  const items = (plan && plan.built && !plan.groceryDone) ? buildGroceryList() : [];
  ((plan && plan.extras) || []).forEach(x=>{
    items.push({key: 'extra-' + x.id, id: x.id, name: x.name, qtyText: x.qty, note: '', cat: x.category, extra: true});
  });
  return items;
}

  return html;

function openImportDataSheet(){
  openSheet(`
    <div class="sheet-handle"></div>
    <h2>Import from JSON</h2>
    <p style="font-size:13px;color:var(--brown);line-height:1.5;margin-bottom:12px;">Choose a .json file or paste the text below. New recipes are added; nothing already here is erased or changed.</p>
    <input type="file" id="import-data-file" accept=".json,application/json" style="margin-bottom:10px;width:100%;">
    <textarea id="import-data-textarea" placeholder="…or paste JSON text here" style="width:100%;min-height:160px;font-size:12px;font-family:monospace;padding:10px;border:1px solid var(--line-strong);border-radius:2px;background:var(--card);color:var(--ink);"></textarea>
    <div id="import-data-status" style="font-size:13px;color:var(--brown);margin:8px 0;min-height:16px;"></div>
    <div class="btn-row"><button class="primary-btn" id="import-data-submit-btn">Import</button><button class="secondary-btn" id="import-data-cancel-btn">Cancel</button></div>
  `);
  document.getElementById('import-data-cancel-btn').addEventListener('click', closeSheet);
  document.getElementById('import-data-file').addEventListener('change', async (e)=>{
    const f = e.target.files[0];
    if(!f) return;
    try { document.getElementById('import-data-textarea').value = await f.text(); document.getElementById('import-data-status').textContent = 'File loaded. Tap Import.'; }
    catch(err){ document.getElementById('import-data-status').textContent = "Couldn't read that file."; }
  });
  document.getElementById('import-data-submit-btn').addEventListener('click', async ()=>{
    const status = document.getElementById('import-data-status');
    const raw = document.getElementById('import-data-textarea').value.trim();
    if(!raw){ status.textContent = 'Paste some JSON first.'; return; }
    let parsed;
    try { parsed = JSON.parse(raw); } catch(e){ status.textContent = "That doesn't look like valid JSON."; return; }
    status.textContent = 'Importing…';
    let importSummary = '';
    try {
      if(parsed.recipes){
        let added = 0, skipped = 0, photosAdded = 0;
        for(const id in parsed.recipes){
          if(state.recipes[id]){
            // never overwrite a recipe that is already here; only fill in a missing photo
            const inc = parsed.recipes[id];
            if(!state.recipes[id].photo && inc && inc.photo){ state.recipes[id].photo = inc.photo; await saveRecipe(state.recipes[id]); photosAdded++; }
            skipped++; continue;
          }
          const r = parsed.recipes[id];
          if(typeof r.subtitle !== 'string'){ const [mt, st] = splitTitle(r.title); r.title = mt; r.subtitle = st; }
          if(!CUISINE_KEYS.includes(r.cuisine)) r.cuisine = guessCuisine(fullTitle(r), r.ingredients);
          (r.ingredients || []).forEach(i => { if(!CAT_KEYS.includes(i.category)) i.category = guessCategory(i.name); });
          state.recipes[id] = r;
          await saveRecipe(r);
          added++;
        }
        importSummary = `Added ${added} recipe${added===1?'':'s'}` + (skipped ? `, skipped ${skipped} already here` : '') + (photosAdded ? `, added ${photosAdded} missing photo${photosAdded===1?'':'s'}` : '');
      }
      if(parsed.plans){
        for(const id in parsed.plans){
          if(!state.plans[id]){
            state.plans[id] = normPlan({...parsed.plans[id], id});
            await savePlan(state.plans[id]);
          }
        }
      }
      if(!parsed.recipes && !parsed.plans){ status.textContent = "No recipes found in that JSON."; return; }
      closeSheet();
      if(importSummary) setTimeout(()=>appAlert(importSummary), 50);
    } catch(e){
      console.error('import failed', e);
      status.textContent = 'Import failed — check your connection and try again.';
    }
  });
}

const APP_VERSION = '10.0';

function describeView(){
  if(cookIsOpen()) return 'Cooking mode';
  const v = currentView();

function openBugSheet(){
  const where = describeView();
  openSheet(`
    <div class="sheet-handle"></div>
    <h2>Bug or idea</h2>
    <div class="seg-row"><button type="button" class="chip active" data-rtype="bug">Report a bug</button><button type="button" class="chip" data-rtype="feature">Request a feature</button></div>
    <p class="sheet-note" id="bug-help">Say what went wrong and what you were doing. It's saved to the shared list, which only the approved signed-in users can see.</p>
    <div class="field"><label id="bug-label">What happened?</label><textarea id="bug-text" placeholder="e.g. When I tap Add on a recipe the count doesn't change…" style="min-height:110px;"></textarea></div>
    <div class="sheet-note">Screen: ${esc(where)}</div>
    <div id="bug-status" class="sheet-status"></div>
    <div class="btn-row"><button class="primary-btn" id="bug-send">Save report</button><button class="secondary-btn" id="bug-cancel">Close</button></div>
    <button class="secondary-btn" id="bug-list-btn">View reported bugs and requests</button>
  `);
  let reportType = 'bug';
  document.querySelectorAll('[data-rtype]').forEach(b => b.onclick = ()=>{
    reportType = b.dataset.rtype;
    document.querySelectorAll('[data-rtype]').forEach(x => x.classList.toggle('active', x === b));
    const feat = reportType === 'feature';
    document.getElementById('bug-help').textContent = feat ? "Describe the feature you'd like. It's saved to the shared list so it can be built later." : "Say what went wrong and what you were doing. It's saved to the shared list, which only the approved signed-in users can see.";
    document.getElementById('bug-label').textContent = feat ? 'What would you like?' : 'What happened?';
    document.getElementById('bug-text').placeholder = feat ? 'e.g. Let me sort recipes by cooking time…' : "e.g. When I tap Add on a recipe the count doesn't change…";
  });
  document.getElementById('bug-cancel').onclick = closeSheet;
  document.getElementById('bug-list-btn').onclick = openBugListSheet;
  document.getElementById('bug-send').onclick = async ()=>{
    const textEl = document.getElementById('bug-text');
    const status = document.getElementById('bug-status');
    const btn = document.getElementById('bug-send');
    const text = textEl.value.trim();
    if(!text){ status.textContent = 'Write something first.'; return; }
    btn.disabled = true;
    status.textContent = 'Saving…';
    const bug = {
      id: uid(), text, type: reportType, status: 'open', created: Date.now(),
      reporter: (auth && auth.currentUser && auth.currentUser.email) || 'unknown',
      screen: where, version: APP_VERSION, device: (navigator.userAgent || '').slice(0, 160)
    };
    try {
      await dbSet('bugs/' + bug.id, bug);
      closeSheet();
      showToast(reportType === 'feature' ? 'Thanks, your idea is saved.' : 'Thanks, the bug is saved.');
      return;
    } catch(e){
      console.error('bug save failed', e);
      status.textContent = "Couldn't save that. Check your connection and try again.";
    }
    btn.disabled = false;
  };
}

async function openBugListSheet(){
  openSheet(`<div class="sheet-handle"></div><h2>Reported bugs</h2><div class="loading">Loading…</div>`);
  let bugs;
  try { bugs = (await dbGet('bugs')) || {}; }
  catch(e){
    document.getElementById('sheet').innerHTML = `<div class="sheet-handle"></div><h2>Reported bugs</h2><p class="sheet-note">Couldn't load the bug list. Check your connection.</p><button class="secondary-btn" id="bl-close">Close</button>`;
    document.getElementById('bl-close').onclick = closeSheet;
    return;
  }
  paintBugList(bugs);
}

function bugDate(ts){
  try { return new Date(ts).toLocaleString('en-AU', {day:'numeric', month:'short', hour:'numeric', minute:'2-digit'}); }
  catch(e){ return ''; }
}

function paintBugList(bugs){
  const list = Object.values(bugs).sort((a,b)=>{
    if(a.status !== b.status) return a.status === 'open' ? -1 : 1;
    return (b.created || 0) - (a.created || 0);
  });
  const openCount = list.filter(b => b.status === 'open').length;
  let html = `<div class="sheet-handle"></div><h2>Bugs and ideas</h2><div id="bl-root">
    <p class="sheet-note">${openCount} open · ${list.length - openCount} fixed</p>`;
  if(!list.length) html += `<div class="empty-state"><p>No bugs reported yet.</p></div>`;
  list.forEach(b=>{
    html += `
      <div class="bug-item ${b.status === 'open' ? '' : 'done'}">
        <div class="bug-text">${b.type === 'feature' ? '<strong>💡 Feature request: </strong>' : ''}${esc(b.text)}</div>
        <div class="bug-meta">${esc(bugDate(b.created))} · ${esc(b.reporter || '')} · ${esc(b.screen || '')}</div>
        <div class="bug-actions">
          <button data-bug-toggle="${esc(b.id)}">${b.status === 'open' ? 'Mark fixed' : 'Reopen'}</button>
          <button data-bug-del="${esc(b.id)}" class="del">Delete</button>
        </div>
      </div>`;
  });
  html += `
    <button class="secondary-btn" id="bl-copy">Copy open bugs as text</button>
    <button class="secondary-btn" id="bl-back">Report a bug or idea</button>
    <button class="secondary-btn" id="bl-close">Close</button></div>`;
  document.getElementById('sheet').innerHTML = html;

  const root = document.getElementById('bl-root');
  root.addEventListener('click', async (e)=>{
    const tg = e.target.closest('[data-bug-toggle]');
    const dl = e.target.closest('[data-bug-del]');
    try {
      if(tg){
        const b = bugs[tg.dataset.bugToggle];
        b.status = b.status === 'open' ? 'done' : 'open';
        await dbSet('bugs/' + b.id, b);
        paintBugList(bugs);
      } else if(dl){
        if(!(await appConfirm('Delete this report?', 'Delete', true))) return;
        const id = dl.dataset.bugDel;
        await dbDelete('bugs/' + id);
        delete bugs[id];
        paintBugList(bugs);
      }
    } catch(err){ console.error('bug update failed', err); }
  });
  document.getElementById('bl-close').onclick = closeSheet;
  document.getElementById('bl-back').onclick = openBugSheet;
  document.getElementById('bl-copy').onclick = async ()=>{
    const open = list.filter(b => b.status === 'open');
    const text = `Tavola open bugs and feature requests (${open.length}), app version ${APP_VERSION}\n\n` +
      open.map((b,i)=>`${i+1}. ${b.type === 'feature' ? '[FEATURE REQUEST] ' : ''}${b.text}\n   [${b.screen || ''}; ${b.reporter || ''}; ${bugDate(b.created)}]`).join('\n\n');
    const btn = document.getElementById('bl-copy');
    try { await navigator.clipboard.writeText(text); btn.textContent = 'Copied!'; }
    catch(e){ btn.textContent = "Couldn't copy"; }
    setTimeout(()=>{ if(btn.isConnected) btn.textContent = 'Copy open bugs as text'; }, 1500);
  };
}

/* ---------- AI RECIPE IMPORT (screenshots, PDF or website) ----------
   Uses Claude through an Anthropic API key that is stored in the shared database (secrets/anthropicApiKey).
   The database rules only allow the approved Google accounts to read it, so any approved user can import
   recipes without ever seeing or pasting the key again. The key is never written into this page's code. */
const IMPORT_MODEL = 'claude-sonnet-5';
// estimated price in US dollars per million tokens (third-party published rate; change here if Anthropic's price changes)
const IMPORT_PRICE = {input: 2, output: 10};
const IMPORT_KEY_PATH = 'secrets/anthropicApiKey';
const IMPORT_MAX_IMAGES = 12;
const IMPORT_MAX_PDF_BYTES = 20 * 1024 * 1024;
let importKeyCache = null;
const importState = {mode:'shots', images:[], pdf:null, url:'', busy:false, message:''};

async function getImportKey(force){
  if(importKeyCache && !force) return importKeyCache;
  const k = await dbGet(IMPORT_KEY_PATH);
  importKeyCache = (typeof k === 'string' && k.trim()) ? k.trim() : null;
  return importKeyCache;
}

async function callClaude(key, content, opts){
  opts = opts || {};
  const body = {model: IMPORT_MODEL, max_tokens: opts.maxTokens || 4096, messages: [{role:'user', content}]};
  if(opts.tools) body.tools = opts.tools;
  let res;
  try {
    res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify(body)
    });
  } catch(e){
    throw Object.assign(new Error("Couldn't reach Claude. Check your connection and try again."), {status: 0});
  }
  let data = null;
  try { data = await res.json(); } catch(e){}
  if(!res.ok){
    const msg = (data && data.error && data.error.message) || ('HTTP ' + res.status);
    let friendly = msg;
    if(res.status === 401) friendly = 'The API key was rejected. Check it was copied in full, or replace it in Import settings.';
    else if(/credit balance/i.test(msg)) friendly = 'The Anthropic API account is out of credit. Add credit at console.anthropic.com under Billing.';
    else if(res.status === 429) friendly = 'Too many requests right now. Wait a minute and try again.';
    else if(res.status >= 500) friendly = 'Claude is busy right now. Try again shortly.';
    throw Object.assign(new Error(friendly), {status: res.status});
  }
  return data;
}

function recipePrompt(sourceText){
  return `You are extracting ONE recipe from ${sourceText}.

Rules:
- Combine everything into ONE recipe. If the source contains several recipes, extract only the main one. Ignore adverts, comments, life stories, nutrition tables and navigation text.
- Convert all weight measurements to grams (g) or kilograms (kg), and all liquid volumes to millilitres (ml) or litres (l). Teaspoon (tsp), tablespoon (tbsp) and cup may stay as they are. Convert temperatures to degrees Celsius.
- For whole or countable ingredients (eggs, garlic cloves, bell peppers, etc.) put the count as qty and leave unit as an empty string, folding the counting word into the ingredient name (e.g. "garlic cloves", "large eggs").
- If a seasoning or oil (salt, pepper, oil, spices, etc.) only appears inside the instruction steps with per-step amounts, sum all of its occurrences into ONE ingredient entry with the total quantity.
- For each ingredient set category to exactly one of: produce (fruit and vegetables, fresh herbs), meat (meat, fish, tofu and meat alternatives), dairy (milk, cheese, yoghurt, butter, eggs), bakery (bread, wraps, rolls), pantry (tins, oils, sauces, grains, pasta, flour, sugar, nuts, stock), spices (dried herbs, spices, salt, pepper), frozen, drinks, other.
- Set cuisine to exactly one of: italian, mexican, asian, indian, mediterranean, middle-eastern, french, american, salad, soup, burgers, other, whichever best describes the dish.
- Pick exactly one tag from: breakfast, lunch, dinner, snack, dessert, whichever best fits the dish.
- Estimate total time in minutes and servings if not stated exactly.
- Write each instruction step as a clear, standalone sentence or two, preserving all temperatures, times and quantities.

Respond with ONLY one JSON object in exactly this shape, with no markdown code fences and no commentary before or after it:
{"title":"","tag":"","cuisine":"","time":0,"servings":0,"ingredients":[{"name":"","qty":"","unit":"","category":""}],"steps":[""]}`;
}

function parseRecipeJson(data){
  const blocks = (data.content || []).filter(b => b.type === 'text');
  for(let i = blocks.length - 1; i >= 0; i--){
    const t = blocks[i].text || '';
    const s = t.indexOf('{'), e = t.lastIndexOf('}');
    if(s >= 0 && e > s){
      try { return JSON.parse(t.slice(s, e + 1)); } catch(err){}
    }
  }
  throw Object.assign(new Error("I couldn't find a recipe in that. Try a clearer source, or a different way (screenshots, PDF or website)."), {status: -1});
}

function normalizeDraft(d){
  const allowedTags = ['breakfast','lunch','dinner','snack','dessert'];
  const allowedUnits = ['', 'g', 'kg', 'ml', 'l', 'tsp', 'tbsp', 'cup'];
  return {
    title: (d.title || 'Imported Recipe').toString(),
    tag: allowedTags.includes(d.tag) ? d.tag : 'dinner',
    cuisine: CUISINE_KEYS.includes(d.cuisine) ? d.cuisine : null,
    time: parseInt(d.time) || 0,
    servings: parseInt(d.servings) || 1,
    ingredients: Array.isArray(d.ingredients) && d.ingredients.length
      ? d.ingredients.map(i => ({
          name: (i.name || '').toString(),
          qty: (i.qty !== undefined && i.qty !== null) ? i.qty.toString() : '',
          unit: allowedUnits.includes((i.unit || '').toString()) ? (i.unit || '').toString() : '',
          category: CAT_KEYS.includes(i.category) ? i.category : guessCategory(i.name)
        }))
      : [{name:'', qty:'', unit:'', category:'other'}],
    steps: Array.isArray(d.steps) && d.steps.length ? d.steps.map(s => s.toString()) : [''],
    photo: d.photo || null
  };
}

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1] || '');
    r.onerror = () => reject(new Error('file read failed'));
    r.readAsDataURL(file);
  });
}

function importSheetIsShowing(){ return !!document.getElementById('imp-root'); }

async function openImportSheet(){

function paintImportSheet(){
  const st = importState;
  const modes = [['shots','Screenshots'], ['pdf','PDF'], ['web','Website']];
  let body = '';
  if(st.mode === 'shots'){
    body = `
      <p class="sheet-note">Add every screenshot for <strong>one</strong> recipe, with the top of the recipe first. You can add more in several goes.</p>
      <div class="field"><input type="file" id="imp-files" accept="image/*" multiple ${st.busy ? 'disabled' : ''}></div>
      <div class="thumbs">${st.images.map((img,i)=>`
        <div class="thumb"><img src="${img.url}" alt="Screenshot ${i+1}"><span>${i+1}</span>${st.busy ? '' : `<button type="button" data-imp-rm="${i}" aria-label="Remove screenshot ${i+1}">×</button>`}</div>`).join('')}</div>`;
  } else if(st.mode === 'pdf'){
    body = `
      <p class="sheet-note">Choose a PDF of the recipe (up to 20 MB).</p>
      <div class="field"><input type="file" id="imp-pdf" accept="application/pdf,.pdf" ${st.busy ? 'disabled' : ''}></div>
      ${st.pdf ? `<div class="file-chip">📄 ${esc(st.pdf.name)} · ${(st.pdf.size/1024/1024).toFixed(1)} MB <button type="button" data-imp-rm-pdf="1" aria-label="Remove PDF">×</button></div>` : ''}`;
  } else {
    body = `
      <p class="sheet-note">Paste the link to a recipe page. Claude reads the page for you. If a site blocks it, use screenshots or save the page as a PDF instead.</p>
      <div class="field"><input type="url" id="imp-url" placeholder="https://…" value="${esc(st.url)}" inputmode="url" autocapitalize="off" ${st.busy ? 'disabled' : ''}></div>`;
  }
  const ready = !st.busy && ((st.mode === 'shots' && st.images.length) || (st.mode === 'pdf' && st.pdf) || (st.mode === 'web' && st.url.trim()));
  document.getElementById('sheet').innerHTML = `
    <div class="sheet-handle"></div>
    <h2>Import a recipe</h2>
    <div id="imp-root">
      <div class="chip-row">${modes.map(([m,l])=>`<button type="button" class="chip ${st.mode===m?'active':''}" data-imp-mode="${m}" ${st.busy?'disabled':''}>${l}</button>`).join('')}</div>
      ${body}
      <div class="sheet-status" id="imp-status">${esc(st.message)}</div>
      <button class="primary-btn" id="imp-run" ${ready ? '' : 'disabled'}>${st.busy ? 'Reading the recipe…' : 'Read recipe'}</button>
      <button class="secondary-btn" id="imp-settings" ${st.busy ? 'disabled' : ''}>Import settings</button>
      <button class="secondary-btn" id="imp-cancel">Cancel</button>
    </div>`;

  const root = document.getElementById('imp-root');
  root.addEventListener('click', (e)=>{
    const modeBtn = e.target.closest('[data-imp-mode]');
    const rm = e.target.closest('[data-imp-rm]');
    const rmPdf = e.target.closest('[data-imp-rm-pdf]');
    if(modeBtn){ st.mode = modeBtn.dataset.impMode; st.message = ''; paintImportSheet(); }
    else if(rm){ st.images.splice(parseInt(rm.dataset.impRm), 1); st.message = ''; paintImportSheet(); }
    else if(rmPdf){ st.pdf = null; st.message = ''; paintImportSheet(); }
  });
  document.getElementById('imp-cancel').onclick = closeSheet;
  document.getElementById('imp-settings').onclick = ()=>paintKeySetup('manage');
  document.getElementById('imp-run').onclick = runImport;

  const files = document.getElementById('imp-files');
  if(files) files.addEventListener('change', async ()=>{
    const picked = Array.from(files.files || []);
    if(!picked.length) return;
    st.message = 'Preparing screenshots…';
    document.getElementById('imp-status').textContent = st.message;
    for(const f of picked){
      if(st.images.length >= IMPORT_MAX_IMAGES){ st.message = `That's the maximum of ${IMPORT_MAX_IMAGES} screenshots.`; break; }
      try {
        const url = await resizeImage(f, 1600, 0.85);
        st.images.push({url, b64: url.split(',')[1]});
        st.message = '';
      } catch(err){ st.message = "One of those files couldn't be read as an image."; }
    }
    if(importSheetIsShowing()) paintImportSheet();
  });
  const pdf = document.getElementById('imp-pdf');
  if(pdf) pdf.addEventListener('change', async ()=>{
    const f = pdf.files && pdf.files[0];
    if(!f) return;
    if(f.size > IMPORT_MAX_PDF_BYTES){ st.message = 'That PDF is over 20 MB. Try screenshots instead.'; st.pdf = null; paintImportSheet(); return; }
    try { st.pdf = {name: f.name, size: f.size, b64: await fileToBase64(f)}; st.message = ''; }
    catch(err){ st.pdf = null; st.message = "Couldn't read that PDF."; }
    if(importSheetIsShowing()) paintImportSheet();
  });
  const url = document.getElementById('imp-url');
  if(url) url.addEventListener('input', ()=>{
    st.url = url.value;
    document.getElementById('imp-run').disabled = !st.url.trim();
  });
}

async function runImport(){
  const st = importState;
  let content, tools;
  if(st.mode === 'shots'){
    if(!st.images.length) return;
    content = st.images.map(img => ({type:'image', source:{type:'base64', media_type:'image/jpeg', data: img.b64}}));
    content.push({type:'text', text: recipePrompt('the screenshots provided. The images are in reading order and may show different parts of the SAME single recipe (a cover photo, the ingredients list, the step-by-step instructions)')});
  } else if(st.mode === 'pdf'){
    if(!st.pdf) return;
    content = [
      {type:'document', source:{type:'base64', media_type:'application/pdf', data: st.pdf.b64}},
      {type:'text', text: recipePrompt('the attached PDF')}
    ];
  } else {
    let u;
    try { u = new URL(st.url.trim()); if(!/^https?:$/.test(u.protocol)) throw new Error('bad'); }
    catch(e){ st.message = "That doesn't look like a web link. It should start with https://"; paintImportSheet(); return; }
    content = `Fetch this web page and extract the recipe from it: ${u.href}\n\n` + recipePrompt('that web page');
    tools = [{type:'web_fetch_20260318', name:'web_fetch', max_uses:2, max_content_tokens:60000}];
  }

  st.busy = true;
  st.message = 'Reading the recipe. This usually takes 15 to 40 seconds.';
  paintImportSheet();
  try {
    const key = await getImportKey();
    if(!key) throw Object.assign(new Error('No API key is saved yet. Add one in Import settings.'), {status: 401});
    const data = await callClaude(key, content, {tools, maxTokens: 4096});
    const draft = normalizeDraft(parseRecipeJson(data));
    const u = (data && data.usage) || {};
    const inTok = (u.input_tokens || 0) + (u.cache_creation_input_tokens || 0) + (u.cache_read_input_tokens || 0), outTok = u.output_tokens || 0;
    const cost = (inTok * IMPORT_PRICE.input + outTok * IMPORT_PRICE.output) / 1e6;
    draft.importNote = `Import cost: about US$${cost < 0.01 ? cost.toFixed(4) : cost.toFixed(3)} (${inTok.toLocaleString()} tokens in, ${outTok.toLocaleString()} out). This is an estimate.`;
    st.busy = false;
    st.message = '';
    if(!importSheetIsShowing()) return; // the sheet was closed while we waited
    closeSheet();
    openRecipeForm(null, draft);
  } catch(err){
    console.error('recipe import failed', err && err.message);
    st.busy = false;
    st.message = (err && err.message) || "That didn't work. Try again.";
    if(importSheetIsShowing()) paintImportSheet();
  }
}

function paintKeySetup(mode){
  const hasKey = !!importKeyCache;
  const manage = (mode === 'manage' && hasKey);
  const masked = hasKey ? '…' + importKeyCache.slice(-4) : '';
  document.getElementById('sheet').innerHTML = `
    <div class="sheet-handle"></div>
    <h2>${manage ? 'Import settings' : 'Set up recipe import'}</h2>
    <div id="key-root">
    ${manage ? `
      <p class="sheet-note">An API key is saved in your private recipe database (ends <strong>${esc(masked)}</strong>). Any approved signed-in user can import recipes with it.</p>
      <div class="sheet-status" id="key-status"></div>
      <button class="primary-btn" id="key-back">Back to import</button>
      <button class="secondary-btn" id="key-replace">Replace key</button>
      <button class="danger-btn" id="key-remove">Remove key</button>
    ` : `
      <p class="sheet-note">Importing uses Claude to read screenshots, PDFs and web pages. It needs an Anthropic API key. Add it once here and it's saved in your private recipe database, so everyone approved can import without pasting it again.</p>
      <ol class="sheet-steps">
        <li>Go to <strong>console.anthropic.com</strong> and sign in.</li>
        <li>Under <strong>Billing</strong>, add a few dollars of credit, and set a low monthly spend limit.</li>
        <li>Under <strong>API keys</strong>, create a key and copy it (it starts with <em>sk-ant-</em>).</li>
        <li>Paste it below. Don't send it to anyone, or paste it into a chat.</li>
      </ol>
      <div class="field"><label>Anthropic API key</label><input id="key-input" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk-ant-…"></div>
      <div class="sheet-status" id="key-status"></div>
      <button class="primary-btn" id="key-save">Save and test key</button>
      <button class="secondary-btn" id="key-cancel">${hasKey ? 'Back' : 'Cancel'}</button>
    `}
    </div>`;

  const status = document.getElementById('key-status');
  const on = (id, fn) => { const el = document.getElementById(id); if(el) el.onclick = fn; };
  on('key-back', paintImportSheet);
  on('key-replace', ()=>paintKeySetup('new'));
  on('key-cancel', ()=>{ if(hasKey) paintImportSheet(); else closeSheet(); });
  on('key-remove', async ()=>{
    if(!(await appConfirm('Remove the saved API key? Nobody will be able to import recipes until a new key is added.', 'Remove', true))) return;
    try {
      await dbDelete(IMPORT_KEY_PATH);
      importKeyCache = null;
      paintKeySetup('new');
    } catch(e){ status.textContent = "Couldn't remove the key. Try again."; }
  });
  on('key-save', async ()=>{
    const input = document.getElementById('key-input');
    const key = input.value.trim();
    if(!key){ status.textContent = 'Paste your API key first.'; return; }
    if(!key.startsWith('sk-ant-')){ status.textContent = 'That does not look like an Anthropic key. It should start with sk-ant-'; return; }
    const btn = document.getElementById('key-save');
    btn.disabled = true;
    status.textContent = 'Testing the key…';
    try {
      await callClaude(key, 'Reply with the single word OK.', {maxTokens: 8});
      status.textContent = 'Key works. Saving…';
      await dbSet(IMPORT_KEY_PATH, key);
      importKeyCache = key;
      importState.message = '';
      if(sheetIsOpen()) paintImportSheet();
    } catch(err){
      console.error('key save failed', err && err.message);
      status.textContent = (err && err.status === 401) ? "That key was rejected. Check that it was copied in full." : ((err && err.message) || "Couldn't save the key.");
      btn.disabled = false;
    }
  });
}

/* ---------- DIALOGS & TOAST (replace the browser's alert/confirm so they say "Tavola") ---------- */
function appDialog(message, buttons){
  return new Promise(resolve=>{
    const ov = document.getElementById('dlg-overlay');
    document.getElementById('dlg-msg').textContent = message;
    const box = document.getElementById('dlg-actions');
    box.innerHTML = '';
    const finish = v => { ov.classList.add('hidden'); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = e => { if(e.key === 'Escape') finish(false); };
    buttons.forEach(b=>{
      const el = document.createElement('button');
      el.type = 'button'; el.textContent = b.label; if(b.cls) el.className = b.cls;
      el.onclick = () => finish(b.value);
      box.appendChild(el);
    });
    ov.classList.remove('hidden');
    document.addEventListener('keydown', onKey);
    const first = box.querySelector('.ok, .danger') || box.lastChild;
    if(first) first.focus();
  });
}
function appAlert(message){ return appDialog(message, [{label:'OK', value:true, cls:'ok'}]); }
function appConfirm(message, okLabel, danger){ return appDialog(message, [{label:'Cancel', value:false}, {label: okLabel || 'OK', value:true, cls: danger ? 'danger' : 'ok'}]); }
let toastTimer = null;
function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.style.display = '';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.style.display = 'none'; }, 3500);
}

      <div class="field">
        <label>Ingredients</label>

      <div class="field">

  `;
  openSheet(html);

  let stepCount = r.steps.length;

  const photoInput = document.getElementById('f-photo');
  const removePhotoBtn = document.getElementById('remove-photo-btn');
  photoInput.addEventListener('change', async (e)=>{

    if(!file) return;
    try {
      currentPhotoData = await resizeImage(file); photoTouched = true;
      document.getElementById('photo-preview-wrap').innerHTML = `<img id="photo-preview" src="${currentPhotoData}" alt="" style="width:100%;max-height:180px;object-fit:cover;border-radius:2px;margin-bottom:8px;display:block;">`;
      removePhotoBtn.style.display = 'block';
    } catch(err){ console.error('photo resize failed', err); }
  });
  removePhotoBtn.addEventListener('click', ()=>{
    currentPhotoData = null; photoTouched = true;
    document.getElementById('photo-preview-wrap').innerHTML = '';
    removePhotoBtn.style.display = 'none';
    photoInput.value = '';
  });

  const form = document.getElementById('recipe-form');
  document.getElementById('add-ing-btn').onclick = ()=>{
    document.getElementById('ing-list').insertAdjacentHTML('beforeend', ingredientRowHtml(null, ingCount++));
  };
  document.getElementById('add-step-btn').onclick = ()=>{
    document.getElementById('step-list').insertAdjacentHTML('beforeend', stepRowHtml(null, stepCount++));
  };
  form.addEventListener('click', (e)=>{
    if(e.target.dataset.removeIng !== undefined) e.target.closest('.ing-block').remove();
    if(e.target.dataset.removeStep !== undefined) e.target.closest('.step-row').remove();
  });
  const cuBox = document.getElementById('f-cuisines');
  const syncChips = ()=> cuBox.querySelectorAll('.cu-chip').forEach(l => l.classList.toggle('on', l.querySelector('input').checked));
  const refreshCuisine = ()=>{
    if(cuBox.dataset.auto === '0') return;
    const names = Array.from(document.querySelectorAll('#ing-list .ing-name')).map(x => ({name: x.value}));
    const g = guessCuisine(document.getElementById('f-title').value, names);
    cuBox.querySelectorAll('input').forEach(i => { i.checked = (i.value === g); });
    syncChips();
  };
  document.getElementById('f-newcat-add').onclick = async ()=>{
    const inp = document.getElementById('f-newcat');
    const label = inp.value.trim().replace(/\s+/g, ' ');
    if(!label) return;
    let key = CUISINES.find(c => c.label.toLowerCase() === label.toLowerCase());
    key = key ? key.key : 'c-' + label.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    if(!CUISINE_KEYS.includes(key)){
      state.customCuisines[key] = label;
      applyCustomCuisines();
      try { await dbSet('customCuisines/' + key, label); } catch(e){ console.error('save category failed', e); }
    }
    const picked = Array.from(cuBox.querySelectorAll('input:checked')).map(i => i.value);
    if(!picked.includes(key)) picked.push(key);
    cuBox.innerHTML = cuisineChipsHtml(picked);

    inp.value = '';
  };
  cuBox.addEventListener('change', ()=>{ cuBox.dataset.auto = '0'; syncChips(); });
  form.addEventListener('input', (e)=>{
    if(e.target.id === 'f-title') refreshCuisine();
    if(!e.target.classList.contains('ing-name')) return;
    const sel = e.target.closest('.ing-block').querySelector('.ing-cat');
    if(sel.dataset.auto !== '0') sel.value = guessCategory(e.target.value);
    refreshCuisine();
  });
  form.addEventListener('change', (e)=>{
    if(e.target.classList.contains('ing-cat')) e.target.dataset.auto = '0';
  });
  document.getElementById('cancel-form-btn').onclick = closeSheet;

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const title = document.getElementById('f-title').value.trim();
    if(!title) return;
    const tag = document.getElementById('f-tag').value;
    const time = document.getElementById('f-time').value || '0';
    const servings = document.getElementById('f-servings').value || '1';
    const ingredients = Array.from(document.querySelectorAll('#ing-list .ing-block')).map(row=>({
      name: row.querySelector('.ing-name').value.trim(),
      category: row.querySelector('.ing-cat').value,
      qty: row.querySelector('.ing-qty').value.trim(),
      unit: row.querySelector('.ing-unit').value.trim()
    })).filter(i=>i.name);
    const steps = Array.from(document.querySelectorAll('#step-list textarea')).map(t=>t.value.trim()).filter(s=>s);

    const id = existingId || uid();
    const cuisinesPicked = Array.from(document.querySelectorAll('#f-cuisines input:checked')).map(i => i.value);
    if(!cuisinesPicked.length) cuisinesPicked.push('other');
    const recipe = {id, title, subtitle: document.getElementById('f-subtitle').value.trim(), tag, cuisine: cuisinesPicked[0], cuisines: cuisinesPicked, time: parseInt(time)||0, servings: parseInt(servings)||1, ingredients, steps, fav: !!(existingId && state.recipes[existingId] && state.recipes[existingId].fav)};
    const old = existingId ? state.recipes[existingId] : null;
    if(old){ recipe.photo = old.photo; recipe.photoRev = old.photoRev || null; }
    if(photoTouched) setRecipePhoto(recipe, currentPhotoData); else if(!old) recipe.photo = currentPhotoData;
    state.recipes[id] = recipe;
    closeSheet();
    if(!existingId) goTab('box');
    await saveRecipe(recipe);
  });
}

mainEl.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch(act){
    case 'fold': state.openFilters = state.openFilters || {}; state.openFilters[id] = !state.openFilters[id]; render(); break;
    case 'filter': state.activeFilter = id; render(); break;
    case 'clear-filters': state.activeFilter = 'all'; state.activeCuisine = 'all'; state.searchTerm = ''; render(); break;
    case 'cfilter': state.activeCuisine = id; render(); break;
    case 'fav': await setFavourite(id); render(); break;
    case 'plan-done': {
      const pl = activePlan(); if(!pl) break;
      pl.done = pl.done || {};
      if(pl.done[id]) delete pl.done[id]; else pl.done[id] = Date.now();
      render(); await savePlan(pl); break;
    }
    case 'share-recipe': shareRecipePdf(id); break;
    case 'share-plan': sharePlanImage(); break;
    case 'recipe-cooked': { const r = state.recipes[id]; if(r) await toggleCooked(r); break; }
    case 'add-recipe': openAddChoiceSheet(); break;
    case 'import-recipe': openImportSheet(); break;
    case 'where-used': e.preventDefault(); openWhereUsedSheet(id); break;
    case 'open-recipe': goTo({tab: currentView().tab, recipeId: id}); break;
    case 'back': goBack(); break;
    case 'cook': openCookMode(id); break;
    case 'plan-toggle': togglePlanRecipe(id, activePlan()); break;
    case 'edit-recipe': openRecipeForm(id); break;
    case 'delete-recipe': {
      const r = state.recipes[id];
      if(!r || !(await appConfirm(`Delete "${fullTitle(r)}"? This can't be undone.`, 'Delete', true))) break;
      delete state.recipes[id];
      const touched = [];
      Object.values(state.plans).forEach(p=>{
        const before = p.recipeIds.length;
        p.recipeIds = p.recipeIds.filter(x => x !== id);
        if(p.recipeIds.length !== before) touched.push(p);
      });
      goBack();
      await deleteRecipeStorage(id);
      for(const p of touched) await savePlan(p);
      break;
    }
    case 'noop': break;
    case 'ideas-planner': ideasState.fromPlanner = true; openIdeasSheet(id, true); break;
    case 'extra-store': document.querySelectorAll('#extra-store button').forEach(b=>b.classList.toggle('on', b.dataset.id===id)); break;
    case 'ideas': openIdeasSheet(id); break;
    case 'draft-toggle': e.stopPropagation(); await toggleDraft(id); break;
    case 'store-view': state.storeView = id; render(); break;
    case 'store-swap': {
      e.preventDefault();
      state.storePrefs = state.storePrefs || {};
      const nowAldi = state.storePrefs[id] === 'aldi';
      state.storeHold = state.storeHold || {}; state.storeHoldTimers = state.storeHoldTimers || {};
      if(!state.storeHold[id]) state.storeHold[id] = nowAldi ? 'aldi' : 'coles';
      if(nowAldi) delete state.storePrefs[id]; else state.storePrefs[id] = 'aldi';
      clearTimeout(state.storeHoldTimers[id]);
      state.storeHoldTimers[id] = setTimeout(()=>{ delete state.storeHold[id]; render(); }, 2000);   // pause so the change is seen before the item moves
      render();
      try{ if(Object.keys(state.storePrefs).length) await dbSet('storePrefs', state.storePrefs); else await dbDelete('storePrefs'); }catch(err){ console.error(err); }
      break;
    }
    case 'new-plan': openNewPlanSheet(); break;
    case 'add-meals': { const vp = viewPlan(); if(vp && !vp.locked) openMealPicker(); break; }
    case 'go-planner': goTab('planner'); break;
    case 'draft-discard': {
      const dr = curDraft();
      if(!dr || !(await appConfirm('Discard your draft menu?', 'Discard', true))) break;
      delete state.plans[dr.id]; render(); await deletePlanStorage(dr.id); break;
    }
    case 'rtab': currentView().rtab = (id === 'steps') ? 'steps' : 'ingredients'; render(); break;
    case 'serv-dec': case 'serv-inc': {
      const plan = viewPlan(), r = state.recipes[id];
      if(!plan || plan.locked || !r || !plan.recipeIds.includes(id)) break;
      const cur = planServings(plan, r);
      const next = Math.min(99, Math.max(1, cur + (act === 'serv-inc' ? 1 : -1)));
      plan.servings = plan.servings || {};
      plan.servings[id] = next;
      render();
      await savePlan(plan);
      break;
    }
    case 'go-plan': goTab('plan'); break;
    case 'go-list': goTab('list'); break;
    case 'plan-build': {
      const d = curDraft();
      if(!d || !d.recipeIds.length) break;
      d.built = true; d.locked = true; d.groceryDone = false;
      state.activePlanId = d.id;
      state.checks = {};
      goTab('plan');
      showToast('Menu built. Your grocery list is ready.');
      await savePlan(d);
      await saveActivePlanId();
      await saveChecks();
      break;
    }
    case 'plan-lock': {
      const plan = activePlan();
      if(!plan || !plan.recipeIds.length) break;
      plan.locked = true;
      render();
      window.scrollTo(0, 0);
      await savePlan(plan);
      break;
    }
    case 'rebuild-list': {
      const plan = activePlan(); if(!plan) break;
      plan.groceryDone = false; state.checks = {};
      render(); await savePlan(plan); await saveChecks(); break;
    }
    case 'plan-edit': {
      const plan = activePlan();
      if(!plan) break;
      plan.locked = false;
      render();
      await savePlan(plan);
      break;
    }
    case 'plan-remove': togglePlanRecipe(id, viewPlan()); break;
    case 'plan-expand': state.openPlans[id] = !state.openPlans[id]; render(); break;
    case 'plan-activate':
      if(!state.plans[id]) break;
      state.activePlanId = id;
      state.checks = {};
      render();
      window.scrollTo(0, 0);
      await saveActivePlanId();
      await saveChecks();
      break;
    case 'plan-delete-id': {
      const p = state.plans[id];
      if(!p || id === state.activePlanId || !(await appConfirm(`Delete the plan for ${planLabel(p)}?`, 'Delete', true))) break;
      delete state.plans[id];
      render();
      await deletePlanStorage(id);
      break;
    }
    case 'plan-clear': {
      const plan = viewPlan();
      if(!plan || plan.locked || !(await appConfirm(`Remove all meals from the plan for ${planLabel(plan)}?`, 'Remove', true))) break;
      plan.recipeIds = [];
      render();
      await savePlan(plan);
      break;
    }
    case 'check-all':
      allGroceryItems().forEach(it => { state.checks[it.key] = true; });
      render();
      await saveChecks();
      if(groceryAllChecked()) openAllDoneSheet();
      break;
    case 'extra-del': {
      const plan = activePlan();
      if(!plan) break;
      plan.extras = (plan.extras || []).filter(x => x.id !== id);
      delete state.checks['extra-' + id];
      render();
      await savePlan(plan);
      await saveChecks();
      break;
    }
    case 'clear-checks':
      state.checks = {};
      render();
      await saveChecks();
      break;
  }
});

/* ---------- SHARING: a recipe as a PDF, the meal plan as an image ----------
   Pages are drawn on a canvas (so the app's own fonts, fractions and photos come out exactly as on screen),
   then the recipe pages are wrapped into a PDF. The phone's share sheet is used where available, otherwise the file downloads. */
const SHARE_FONT = '"Work Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
const SHARE_TITLE_FONT = '"Marcellus", Georgia, serif';
function shareColors(){
  const cs = getComputedStyle(document.documentElement), g = n => cs.getPropertyValue(n).trim();
  return {ink:g('--ink'), tomato:g('--tomato'), brown:g('--brown'), paper:g('--paper'), card:g('--card'), herb:g('--herb'), line:g('--line-strong')};
}
async function shareFontsReady(){
  try { await Promise.all(['400','600','700'].map(w => document.fonts.load(w + ' 24px "Work Sans"')).concat([document.fonts.load('400 24px "Marcellus"')])); } catch(e){}
}
function shareWrap(ctx, text, maxW){
  const lines = []; let line = '';
  String(text || '').split(/\s+/).filter(Boolean).forEach(w => {
    const t = line ? line + ' ' + w : w;
    if(ctx.measureText(t).width <= maxW || !line) line = t; else { lines.push(line); line = w; }
  });
  if(line) lines.push(line);
  return lines.length ? lines : [''];
}
function shareLoadImg(src){ return new Promise(res => { if(!src) return res(null); const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; }); }
function shareCover(ctx, img, x, y, w, h){
  const s = Math.max(w / img.width, h / img.height), sw = w / s, sh = h / s;
  ctx.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, x, y, w, h);
}
function shareBlob(canvas, type, q){ return new Promise(res => canvas.toBlob(res, type, q)); }
function shareSlug(s){ return String(s || 'tavola').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'tavola'; }

async function renderRecipePages(r){
  await shareFontsReady();
  try { if(state.photosPromise) await state.photosPromise; } catch(e){}
  const C = shareColors(), W = 1240, H = 1754, M = 96, CW = W - 2 * M, BOTTOM = H - 120;
  const pages = []; let cv, ctx, y;
  const newPage = () => { cv = document.createElement('canvas'); cv.width = W; cv.height = H; ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.textBaseline = 'alphabetic'; pages.push(cv); y = M; };
  const ensure = h => { if(y + h > BOTTOM) newPage(); };
  const plan = activePlan(), inPlan = !!(plan && plan.recipeIds.includes(r.id));
  const sf = scaleFactorFor(r), serves = inPlan ? planServings(plan, r) : r.servings;
  newPage();
  ctx.fillStyle = C.tomato; ctx.font = '400 34px ' + SHARE_TITLE_FONT; ctx.fillText('Tavola', M, y + 30); y += 78;
  ctx.fillStyle = C.ink; ctx.font = '700 62px ' + SHARE_FONT;
  shareWrap(ctx, r.title, CW).forEach(l => { ctx.fillText(l, M, y + 52); y += 72; });
  if(r.subtitle){ ctx.fillStyle = C.brown; ctx.font = '400 34px ' + SHARE_FONT; shareWrap(ctx, r.subtitle, CW).forEach(l => { ctx.fillText(l, M, y + 34); y += 46; }); }
  y += 8;
  const meta = [TAG_LABELS[r.tag] || r.tag, CUISINE_LABEL[r.cuisine] && r.cuisine !== 'other' ? CUISINE_LABEL[r.cuisine] : '', r.time ? r.time + ' min' : '', 'serves ' + serves].filter(Boolean).join('  ·  ');
  ctx.fillStyle = C.brown; ctx.font = '600 28px ' + SHARE_FONT; ctx.fillText(meta, M, y + 28); y += 56;
  const img = await shareLoadImg(r.photo);
  if(img){ const ph = 470; shareCover(ctx, img, M, y, CW, ph); y += ph + 40; } else y += 6;

  const heading = t => {
    ensure(120); ctx.fillStyle = C.tomato; ctx.font = '700 26px ' + SHARE_FONT;
    if(ctx.letterSpacing !== undefined) ctx.letterSpacing = '4px';
    ctx.fillText(t.toUpperCase(), M, y + 26); if(ctx.letterSpacing !== undefined) ctx.letterSpacing = '0px';
    y += 40; ctx.fillStyle = C.ink; ctx.fillRect(M, y, CW, 3); y += 14;
  };
  heading('Ingredients');
  if(Math.abs(sf - 1) > 1e-9){ ctx.fillStyle = C.brown; ctx.font = 'italic 400 24px ' + SHARE_FONT; ctx.fillText('Quantities scaled for ' + serves + ' people', M, y + 28); y += 44; }
  (r.ingredients || []).forEach(i => {
    ctx.font = '500 31px ' + SHARE_FONT;
    const q = ingQtyText(i.qty, i.unit, sf), qw = q ? ctx.measureText(q).width : 0;
    const lines = shareWrap(ctx, i.name, CW - qw - 40), rowH = lines.length * 42 + 20;
    ensure(rowH);
    ctx.fillStyle = C.ink; lines.forEach((l, k) => ctx.fillText(l, M, y + 40 + k * 42));
    if(q){ ctx.font = '700 31px ' + SHARE_FONT; ctx.fillStyle = C.brown; ctx.textAlign = 'right'; ctx.fillText(q, M + CW, y + 40); ctx.textAlign = 'left'; }
    y += rowH; ctx.fillStyle = 'rgba(43,38,32,0.14)'; ctx.fillRect(M, y - 4, CW, 2);
  });
  y += 36; ensure(200); heading('Method');
  (r.steps || []).forEach((s, n) => {
    ctx.font = '400 31px ' + SHARE_FONT;
    const lines = shareWrap(ctx, s, CW - 70), h = lines.length * 46 + 26;
    ensure(Math.min(h, 160));
    ctx.fillStyle = C.tomato; ctx.font = '700 31px ' + SHARE_FONT; ctx.fillText(String(n + 1), M, y + 42);
    ctx.fillStyle = C.ink; ctx.font = '400 31px ' + SHARE_FONT;
    lines.forEach(l => { if(y + 46 > BOTTOM + 60) newPage(); ctx.fillText(l, M + 70, y + 42); y += 46; });
    y += 26;
  });
  pages.forEach((p, i) => { const c = p.getContext('2d'); c.fillStyle = '#9a8f80'; c.font = '400 22px ' + SHARE_FONT; c.textAlign = 'left'; c.fillText('Tavola  ·  ' + r.title, M, H - 60); c.textAlign = 'right'; c.fillText('Page ' + (i + 1) + ' of ' + pages.length, W - M, H - 60); c.textAlign = 'left'; });
  return pages;
}

// wraps JPEG page images into a PDF (A4, one image per page)
async function pagesToPdf(pages, title){
  const enc = new TextEncoder(), parts = [], offs = []; let len = 0;
  const push = x => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); len += b.length; };
  const jpgs = [];
  for(const p of pages){ const blob = await shareBlob(p, 'image/jpeg', 0.88); jpgs.push({bytes: new Uint8Array(await blob.arrayBuffer()), w: p.width, h: p.height}); }
  const n = pages.length, PW = 595.28, PH = 841.89;
  push('%PDF-1.4\n%âãÏÓ\n');
  offs[1] = len; push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  offs[2] = len; push('2 0 obj\n<< /Type /Pages /Count ' + n + ' /Kids [' + jpgs.map((_, i) => (3 + 3 * i) + ' 0 R').join(' ') + '] >>\nendobj\n');
  jpgs.forEach((j, i) => {
    const po = 3 + 3 * i, co = po + 1, io = po + 2, content = 'q ' + PW + ' 0 0 ' + PH + ' 0 0 cm /Im0 Do Q';
    offs[po] = len; push(po + ' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + PW + ' ' + PH + '] /Resources << /XObject << /Im0 ' + io + ' 0 R >> >> /Contents ' + co + ' 0 R >>\nendobj\n');
    offs[co] = len; push(co + ' 0 obj\n<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream\nendobj\n');
    offs[io] = len; push(io + ' 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + j.w + ' /Height ' + j.h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + j.bytes.length + ' >>\nstream\n');
    push(j.bytes); push('\nendstream\nendobj\n');
  });
  const total = 3 + 3 * n, xref = len;
  push('xref\n0 ' + total + '\n0000000000 65535 f \n');
  for(let k = 1; k < total; k++) push(String(offs[k]).padStart(10, '0') + ' 00000 n \n');
  push('trailer\n<< /Size ' + total + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');
  return new Blob(parts, {type: 'application/pdf'});
}

async function deliverShareFile(blob, filename, title, text){
  const file = new File([blob], filename, {type: blob.type});
  const save = () => {
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 15000);
    if(text){ try{ navigator.clipboard.writeText(text.split('\n').pop()); showToast('Saved ' + filename + '. Link copied.'); }catch(e){ showToast('Saved ' + filename); } } else showToast('Saved ' + filename);
  };
  const canShare = !!(navigator.canShare && navigator.canShare({files: [file]}));
  if(!canShare){ save(); return; }
  try { await navigator.share(text ? {files: [file], title, text} : {files: [file], title}); return; }
  catch(e){
    if(e && e.name === 'AbortError') return;
    // the browser wants a fresh tap before it opens the share sheet
    const pick = await appDialog('Your ' + (blob.type === 'application/pdf' ? 'PDF' : 'image') + ' is ready.', [{label:'Save to device', value:'save'}, {label:'Share', value:'share', cls:'ok'}]);
    if(pick === 'share'){ try { await navigator.share(text ? {files: [file], title, text} : {files: [file], title}); } catch(e2){ if(!e2 || e2.name !== 'AbortError') save(); } }
    else if(pick === 'save') save();
  }
}

// Where in the step text an ingredient is first mentioned (-1 if it isn't).
function ingredientStepPos(ingName, stepText){
  const primary = (ingName || '').split(',')[0].trim().toLowerCase();
  if(!primary) return -1;
  const stepLower = stepText.toLowerCase();
  const found = [];
  const add = p => { if(p >= 0) found.push(p); };
  add(stepLower.indexOf(primary));
  if(primary.endsWith('s')) add(stepLower.indexOf(primary.slice(0, -1)));
  const words = primary.split(' ').filter(w => w.length > 2);
  if(words.length > 1 && words.every(w => stepLower.includes(w))) add(Math.min(...words.map(w => stepLower.indexOf(w))));
  // main word of the ingredient ("olive oil" -> "oil", "garlic cloves" -> "garlic")
  const GENERIC = ['slice','piece','chunk','bunch','small','pkg','package','can','tin','jar','head','leaf','sprig','stalk','stick','strip','wedge','half','whole','mix','mixture','blend','crown','bulb'];
  const head = normIngName(ingName).split(' ').filter(w => !GENERIC.includes(w)).pop();
  if(head && head.length >= 3){
    const re = /[a-z-]+/g; let m;
    while((m = re.exec(stepLower))){ if(singularWord(m[0]) === head){ add(m.index); break; } }
  }
  return found.length ? Math.min(...found) : -1;
}
function ingredientMatchesStep(ingName, stepText){ return ingredientStepPos(ingName, stepText) >= 0; }

function getStepIngredients(recipe, stepIndex){
  const stepText = recipe.steps[stepIndex] || '';
  return (recipe.ingredients || [])
    .map(ing => ({ing, pos: ing.name ? ingredientStepPos(ing.name, stepText) : -1}))
    .filter(x => x.pos >= 0)
    .sort((a, b) => a.pos - b.pos)
    .map(x => x.ing);
}

function renderCookStep(){

  const stepIngredients = getStepIngredients(r, i);
  const ingredientsHtml = !stepIngredients.length ? '' : `<div class="cook-ings-panel">
      ${stepIngredients.length
        ? stepIngredients.map(ing => {

          if(cookState.editIng === ix) return `<div class="cook-ing-row editing"><span>${esc(ing.name)} <small style="opacity:.7">(recipe amount)</small></span><div class="ce"><input id="ce-qty" inputmode="decimal" value="${esc(ing.qty)}" placeholder="Qty" aria-label="Quantity"><input id="ce-unit" list="ce-units" value="${esc(ing.unit)}" placeholder="Unit" aria-label="Unit"><datalist id="ce-units">${['g','kg','ml','l','tsp','tbsp','cup','can','tin','clove','bunch','pinch','piece','packet'].map(u=>`<option value="${u}">`).join('')}</datalist><button type="button" class="ok" data-ce-save="${ix}">Save</button><button type="button" data-ce-cancel="1">✕</button></div></div>`;
          return `<div class="cook-ing-row" data-ce-edit="${ix}"><span>${esc(ing.name)}</span><span class="cook-ing-qty">${esc(ingQtyText(ing.qty, ing.unit, scaleFactorFor(r)))}</span></div>`;
        }).join('')
        : ''}

  document.getElementById('cook-step-area').innerHTML = `

  document.getElementById('cook-dots').innerHTML = r.steps.map((_,idx)=>
    `<span class="cook-dot ${idx===i?'active':''}"></span>`).join('');
  document.getElementById('cook-prev-btn').disabled = (i === 0);
  document.getElementById('cook-next-btn').textContent = (i === total - 1) ? 'Done' : 'Next';

/* ---------- BACK BUTTON / SWIPE-BACK HANDLING ----------
   The browser history always holds two entries: [guard, cur]. When the user goes back we land on
   'guard', work out what "back one page" means inside the app (close cooking mode, close a sheet,
   leave a recipe, return to Recipes), then push 'cur' again so the next back works the same way.
   On the home screen the first back does nothing; a second back within 3 seconds lets the app close. */
let exitArmedUntil = 0;

function ensureHistory(){
  const st = history.state;
  if(st && st.k === 'cur') return;
  if(st && st.k === 'guard'){ history.pushState({k:'cur'}, ''); return; }
  history.replaceState({k:'guard'}, '');
  history.pushState({k:'cur'}, '');
}
// Chrome only trusts history entries created during a real tap, so set this up on the first touch.
document.addEventListener('pointerdown', ensureHistory, {passive:true});

function handleBack(){
  if(cookIsOpen()){ closeCookMode(); return 'handled'; }
  if(sheetIsOpen()){ closeSheet(); return 'handled'; }
  if(!document.getElementById('setup-overlay').classList.contains('hidden')) return 'handled';
  if(state.loaded && goBack()) return 'handled';
  return 'home';
}

window.addEventListener('popstate', (e)=>{
  if(!(e.state && e.state.k === 'guard')) return;
  const result = handleBack();
  if(result === 'home'){
    if(Date.now() < exitArmedUntil){
      exitArmedUntil = 0;
      history.back();   // second back in a row at home: let the app/browser leave
      return;
    }
    exitArmedUntil = Date.now() + 3000;
  }
  history.pushState({k:'cur'}, '');
});
