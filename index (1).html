<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#2B2620">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tavola">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Tavola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
  :root{
    --paper:#EDE3D0;
    --paper-dark:#E2D5BC;
    --ink:#2B2620;
    --herb:#6B7A38;
    --gold:#C08A2E;
    --tomato:#B8462F;
    --brown:#7A5C3E;
    --card:#FAF6EC;
    --line:rgba(43,38,32,0.16);
    --line-strong:rgba(43,38,32,0.32);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Work Sans',sans-serif;}
  body{
    background-image:
      radial-gradient(circle at 1px 1px, rgba(43,38,32,0.06) 1px, transparent 0);
    background-size: 14px 14px;
  }
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:70px;position:relative;}
  h1,h2,h3{font-family:'Work Sans',sans-serif;font-weight:700;}
  button{font-family:'Work Sans',sans-serif;cursor:pointer;}
  input,textarea,select{font-family:'Work Sans',sans-serif;}

  .app-header{background:var(--ink);color:var(--paper);padding:10px 16px 10px;position:relative;margin-bottom:0;}
  .app-header h1{margin:0;font-family:"Marcellus",Georgia,serif;font-weight:400;letter-spacing:0.5px;font-size:32.8px;white-space:nowrap;letter-spacing:0.2px;}
  .app-header .tagline{margin:6px 0 0;font-size:13px;color:rgba(237,227,208,0.72);}

  main{flex:1;padding:26px 16px 16px;}

  /* Tab bar */
  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--card);border-top:1px solid var(--line-strong);display:flex;z-index:20;}
  .tab{flex:1;border:none;background:none;padding:12px 4px 10px;font-size:12px;color:var(--brown);border-top:3px solid transparent;font-weight:600;}
  .tab.active{color:var(--ink);border-top:3px solid var(--tomato);background:var(--paper-dark);}

  /* Search / filters */
  .search-row{display:flex;gap:8px;margin-bottom:12px;}
  .search-row input{flex:1;padding:10px 12px;border:1px solid var(--line-strong);border-radius:2px;background:var(--card);font-size:14px;color:var(--ink);}
  .search-row input:focus{outline:2px solid var(--herb);outline-offset:1px;}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .chip{padding:5px 12px;border-radius:14px;border:1px solid var(--line-strong);background:var(--card);font-size:12px;color:var(--brown);font-weight:600;}
  .chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .add-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px;background:var(--tomato);color:#fff;border:none;border-radius:2px;font-size:14px;font-weight:600;margin-bottom:10px;}
  .add-btn:active{opacity:0.85;}

  /* Recipe cards */
  .recipe-grid{display:flex;flex-direction:column;gap:18px;}
  .recipe-card{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:16px 14px 14px;position:relative;box-shadow:3px 3px 0 rgba(43,38,32,0.07);cursor:pointer;}
  .card-tag{position:absolute;top:-10px;left:14px;padding:2px 10px;font-family:'Work Sans',sans-serif;font-weight:600;font-size:10.5px;color:#fff;border-radius:1px;letter-spacing:0.3px;}
  .recipe-card h3{margin:8px 0 2px;font-size:22px;line-height:1.2;font-weight:700;}
  .recipe-sub{font-size:13px;color:var(--brown);line-height:1.35;margin-bottom:6px;}
  .detail-sub{font-size:15px;color:var(--brown);line-height:1.4;margin:0 0 8px;}
  .plan-item-sub{font-size:12px;color:var(--brown);line-height:1.3;margin-top:1px;}
  .picker-item .pick-sub{display:block;font-style:normal;font-size:11.5px;color:var(--brown);}
  .cook-step-title .cook-sub{display:block;font-weight:400;font-size:12px;opacity:.8;margin-top:2px;}
  .star-svg{width:62%;height:62%;display:block;}
  .fav-line .fav-btn .star-svg,.cook-finish .fav-btn .star-svg{width:22px;height:22px;}
  .recipe-meta{font-size:12.5px;color:var(--brown);margin-bottom:8px;}
  .cooked-btn{display:block;width:100%;margin:18px 0 4px;padding:14px;font:inherit;font-size:15px;font-weight:600;border-radius:2px;border:1px solid var(--ink);background:none;color:var(--ink);}
  .cooked-btn.on{background:var(--herb);border-color:var(--herb);color:#fff;}
  .cook-stat{font-size:12px;color:var(--herb);font-weight:600;margin:-4px 0 8px;}
  .plan-item .cook-stat{margin:2px 0 0;}
  .recipe-ing-preview{font-size:13px;color:var(--ink);opacity:0.75;line-height:1.4;}

  .empty-state{text-align:center;padding:40px 20px;color:var(--brown);}
  .empty-state h3{font-size:16px;margin-bottom:6px;color:var(--ink);}
  .empty-state p{font-size:13px;line-height:1.5;}

  /* Sheet (modal) */
  .sheet-overlay{position:fixed;inset:0;background:rgba(43,38,32,0.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .sheet-overlay.hidden{display:none;}
  .hidden{display:none;}
  .sheet{background:var(--paper);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:10px 10px 0 0;padding:18px 18px 28px;position:relative;}
  .sheet-handle{width:36px;height:4px;background:var(--line-strong);border-radius:2px;margin:0 auto 14px;}
  .sheet h2{font-size:19px;margin:0 0 14px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--brown);margin-bottom:5px;text-transform:none;}
  .field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid var(--line-strong);border-radius:2px;background:var(--card);font-size:14px;color:var(--ink);}
  .field textarea{resize:vertical;min-height:70px;}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}
  .ing-row{display:flex;gap:6px;margin-bottom:8px;align-items:center;}
  .ing-block{margin-bottom:12px;}
  .ing-block .ing-row{margin-bottom:4px;}
  .ing-cat{width:100%;padding:6px 9px;font-size:12px;border:1px solid var(--line);border-radius:2px;background:var(--paper);color:var(--brown);}
  .ing-row input,.ing-row select{padding:8px 9px;font-size:13px;border:1px solid var(--line-strong);border-radius:2px;background:var(--card);color:var(--ink);}
  .ing-row .ing-name{flex:2;}
  .ing-row .ing-qty{flex:0.7;}
  .ing-row .ing-unit{flex:0.9;}
  .small-btn{border:1px solid var(--line-strong);background:var(--card);border-radius:2px;padding:8px 10px;font-size:13px;color:var(--brown);}
  .remove-x{border:none;background:none;color:var(--tomato);font-size:18px;padding:0 4px;line-height:1;}
  .step-row{display:flex;gap:6px;margin-bottom:8px;align-items:flex-start;}
  .step-num{font-weight:700;font-size:12px;color:var(--brown);padding-top:9px;width:20px;}
  .step-row textarea{flex:1;min-height:44px;font-size:13px;}

  .primary-btn{display:block;width:100%;padding:12px;background:var(--tomato);color:#fff;border:none;border-radius:2px;font-size:14px;font-weight:600;margin-top:8px;}
  .primary-btn:disabled{opacity:.45;}
  .secondary-btn{display:block;width:100%;padding:12px;background:none;border:1px solid var(--line-strong);color:var(--brown);border-radius:2px;font-size:13px;font-weight:600;margin-top:8px;}
  .danger-btn{width:100%;padding:12px;background:none;border:1px solid var(--tomato);color:var(--tomato);border-radius:2px;font-size:13px;margin-top:8px;}

  /* Detail view */
  .detail-back{background:none;border:none;color:var(--brown);font-size:13px;margin-bottom:12px;padding:0;font-weight:600;}
  .detail-title{font-size:28px;line-height:1.15;margin:0 0 4px;}
  .detail-section{margin-top:20px;}
  .rtabs{display:flex;margin-top:16px;border-bottom:2px solid var(--line-strong);}
  .rtab{flex:1;padding:11px 0;background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;font-size:14px;font-weight:600;color:var(--brown);}
  .rtab.active{color:var(--ink);border-bottom-color:var(--tomato);}
  .detail-section h4{font-family:'Work Sans',sans-serif;font-weight:700;font-size:12.5px;color:var(--brown);margin:0 0 10px;letter-spacing:0.6px;text-transform:uppercase;}
  .ing-list{list-style:none;padding:0;margin:0;}
  .ing-list li{padding:9px 0;border-bottom:1px solid var(--line);font-size:17px;}
  .steps-list{padding-left:0;list-style:none;counter-reset:step;margin:0;}
  .steps-list li{counter-increment:step;padding:11px 0 11px 32px;border-bottom:1px solid var(--line);font-size:17px;line-height:1.5;position:relative;}
  .steps-list li::before{content:counter(step);position:absolute;left:0;top:13px;font-weight:700;font-size:14px;color:var(--herb);width:22px;}

  /* Meal plan view */
  .plan-select-wrap{margin-bottom:12px;}
  .plan-select-wrap label{display:block;font-size:12px;font-weight:600;color:var(--brown);margin-bottom:5px;}
  .plan-select-wrap select{width:100%;padding:11px;border:1px solid var(--line-strong);border-radius:2px;background:var(--card);font-size:15px;font-weight:600;color:var(--ink);}
  .plan-current-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--herb);margin:0 0 4px;}
  .plan-date{font-size:22px;font-weight:700;margin:0 0 14px;}
  .prev-plan{background:var(--card);border:1px solid var(--line);border-radius:2px;margin-bottom:8px;}
  .prev-head{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;padding:13px 12px;text-align:left;color:var(--ink);font-size:14.5px;}
  .prev-arrow{color:var(--brown);width:12px;}
  .prev-title{flex:1;font-weight:600;}
  .prev-count{font-size:12px;color:var(--brown);}
  .prev-body{padding:0 12px 12px 34px;}
  .prev-meal{padding:8px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer;}
  .prev-empty,.prev-extras{font-size:13px;color:var(--brown);padding:6px 0;}
  .prev-actions{display:flex;gap:8px;margin-top:8px;}
  .prev-del{color:var(--tomato);}
  .locked-note{background:var(--card);border:1px solid var(--line-strong);border-radius:2px;padding:11px 12px;font-size:13px;color:var(--brown);margin-bottom:10px;line-height:1.4;}
  .plan-hint{font-size:12px;color:var(--brown);margin:8px 0 0;}
  .gro-total{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;margin:0 0 12px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:2px;}
  .gro-total span{font-size:12px;color:var(--brown);}
  .thumb{width:64px;height:64px;border-radius:3px;object-fit:cover;flex-shrink:0;display:block;cursor:pointer;}
  .thumb-sm{width:36px;height:36px;}
  .thumb-empty{display:flex;align-items:center;justify-content:center;color:var(--paper);font-weight:700;font-size:22px;opacity:.85;}
  .thumb-sm.thumb-empty{font-size:15px;}
  .prev-meal{display:flex;align-items:center;gap:10px;}
  .serv-line{margin-top:7px;font-size:13px;color:var(--brown);display:flex;align-items:center;gap:8px;}
  .stepper{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:2px;background:var(--paper);}
  .stepper strong{min-width:30px;text-align:center;color:var(--ink);font-size:14px;}
  .plan-item .stepper button{border:none;background:none;color:var(--ink);font-size:18px;font-weight:600;padding:2px 12px;line-height:1.4;}
  .plan-count{font-size:12.5px;color:var(--brown);margin:18px 0 8px;font-weight:600;}
  .plan-item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:2px;padding:12px;margin-bottom:8px;}
  .plan-item-main{flex:1;cursor:pointer;}
  .plan-item-title{font-size:14.5px;font-weight:600;line-height:1.35;}
  .plan-item-meta{font-size:12px;color:var(--brown);margin-top:2px;}
  .plan-item button{border:none;background:none;color:var(--tomato);font-size:12px;font-weight:600;padding:6px;}

  .picker-item{padding:12px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .picker-item span{flex:1;font-size:14px;line-height:1.35;}
  .picker-item{justify-content:flex-start;}
  .picker-item button{margin-left:auto;}
  .picker-item small{display:block;font-size:11.5px;color:var(--brown);margin-top:2px;}
  .picker-item .thumb{cursor:default;width:46px;height:46px;}
  .picker-chips{margin-bottom:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;}
  .picker-chips .chip{flex-shrink:0;}
  .picker-item button{background:var(--herb);color:#fff;border:none;border-radius:2px;padding:7px 12px;font-size:12px;font-weight:600;min-width:74px;}
  .picker-item button.on{background:var(--ink);}


  .header-right{position:absolute;top:50%;transform:translateY(-50%);right:12px;display:flex;flex-direction:column;align-items:center;gap:5px;}
  .header-btn#menu-header-btn{font-size:20px;padding-bottom:5px;}
  .app-menu{position:absolute;top:calc(100% - 4px);right:14px;min-width:210px;background:var(--card);border:1px solid var(--ink);border-radius:2px;box-shadow:0 6px 18px rgba(43,38,32,.35);z-index:60;}
  .app-menu button{display:block;width:100%;text-align:left;padding:14px 16px;font:inherit;font-size:15px;font-weight:600;color:var(--ink);background:none;border:none;border-top:1px solid var(--line);border-radius:0;}
  .app-menu button:first-child{border-top:none;}
  .app-menu button:active{background:var(--paper-dark);}
  .app-version{font-size:12px;font-weight:600;letter-spacing:0.4px;color:rgba(237,227,208,0.6);}
  .header-btn{background:rgba(237,227,208,0.12);color:var(--paper);border:1px solid rgba(237,227,208,0.32);border-radius:50%;width:34px;height:34px;padding:0;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .sheet-note{font-size:13px;color:var(--brown);line-height:1.5;margin:0 0 12px;}
  .sheet-status{font-size:13px;color:var(--brown);min-height:18px;margin:8px 0;line-height:1.4;}
  .sheet-steps{font-size:13px;color:var(--ink);line-height:1.6;padding-left:20px;margin:0 0 14px;}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
  .thumb{position:relative;width:72px;height:72px;}
  .thumb img{width:72px;height:72px;object-fit:cover;border-radius:2px;border:1px solid var(--line-strong);display:block;}
  .thumb span{position:absolute;left:3px;bottom:3px;background:var(--ink);color:var(--paper);font-size:10px;font-weight:700;border-radius:8px;padding:1px 6px;}
  .thumb button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:none;background:var(--tomato);color:#fff;font-size:14px;line-height:1;padding:0;}
  .file-chip{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line-strong);border-radius:2px;padding:9px 11px;font-size:13px;margin-bottom:6px;}
  .file-chip button{border:none;background:none;color:var(--tomato);font-size:18px;}
  .bug-item{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:11px 12px;margin-bottom:8px;}
  .bug-item.done{opacity:0.6;}
  .bug-text{font-size:14px;line-height:1.45;white-space:pre-wrap;}
  .bug-meta{font-size:11.5px;color:var(--brown);margin-top:5px;}
  .bug-actions{display:flex;gap:14px;margin-top:8px;}
  .bug-actions button{border:none;background:none;color:var(--herb);font-size:12px;font-weight:700;padding:2px 0;}
  .bug-actions button.del{color:var(--tomato);}

  /* Grocery list */
  .grocery-group{margin-bottom:18px;}
  .grocery-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .grocery-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--herb);flex-shrink:0;}
  .grocery-item.checked span{text-decoration:line-through;color:#9c8f77;}
  .grocery-item{align-items:flex-start;gap:12px;padding:11px 0;}
  .grocery-item input[type=checkbox]{margin-top:1px;}
  .gi-name{flex:1;min-width:0;line-height:1.35;}
  .gi-name::first-letter{text-transform:uppercase;}
  .fav-btn{background:rgba(255,255,255,.92);border:1px solid var(--line-strong);color:var(--brown);border-radius:50%;width:38px;height:38px;font-size:18px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;}
  .fav-btn.on{color:#d99a1e;border-color:#d99a1e;}
  .recipe-card .fav-btn{position:absolute;top:6px;right:8px;z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.25);}
  .filter-label{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--brown);margin:10px 0 2px;font-weight:600;}
  .fav-line{display:flex;align-items:center;gap:10px;margin:2px 0 6px;}
  .fav-line .fav-btn{width:auto;border-radius:24px;padding:0 14px;height:36px;gap:8px;}
  .fav-line .fav-btn span{font-size:14px;font-weight:600;}
  .done-col{display:flex;align-items:center;flex-shrink:0;cursor:pointer;padding:4px;}
  .done-col input{-webkit-appearance:none;appearance:none;width:24px;height:24px;margin:0;border-radius:50%;border:2px solid var(--line-strong);background:transparent;cursor:pointer;position:relative;transition:background .15s,border-color .15s;}
  .done-col input:checked{background:var(--herb);border-color:var(--herb);}
  .done-col input:checked::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700;}
  .plan-add-link{color:var(--herb);font-weight:700;cursor:pointer;}
  .plan-item.done{opacity:.5;}
  .plan-item.done .plan-item-title{text-decoration:line-through;}
  .plan-item.done .plan-item-meta,.plan-item.done .serv-line{text-decoration:line-through;}
  .plan-side{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;}
  .plan-item-main{min-width:0;}
  .plan-item .plan-fav{background:none;border:none;width:32px;height:32px;line-height:1;color:var(--brown);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;}
  .plan-item .plan-fav .star-svg{width:26px;height:26px;}
  .picker-item .fav-btn{width:34px;height:34px;}
  .cook-finish{text-align:center;padding:20px 10px;}
  .cook-finish h2{font-size:28px;margin:0 0 6px;}
  .cook-finish p{color:var(--brown);margin:0 0 20px;}
  .cook-finish .fav-btn{width:auto;border-radius:24px;padding:0 20px;height:46px;font-size:16px;gap:8px;margin:0 auto;}
  .app-header .brand{display:flex;flex-direction:row;align-items:center;gap:12px;padding-right:56px;}
  .app-header .brand svg{width:88px;height:88px;flex-shrink:0;border-radius:20px;}
  .plan-headrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px;}
  .plan-headrow .plan-date{margin:0;}
  .plan-title-line{display:flex;align-items:center;gap:8px;}
  .lock-btn{background:var(--card);border:1px solid var(--line-strong);border-radius:50%;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;color:var(--brown);cursor:pointer;padding:0;flex-shrink:0;}
  .lock-btn.locked{color:var(--tomato);border-color:var(--tomato);}
  .lock-btn svg{width:18px;height:18px;}
  .plan-plus{background:var(--herb);color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:26px;line-height:1;font-weight:600;cursor:pointer;flex-shrink:0;box-shadow:2px 2px 0 rgba(43,38,32,.15);}
  .seg-row{display:flex;gap:8px;margin-bottom:12px;}
  .seg-row .chip{flex:1;text-align:center;}
  .choice-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line-strong);border-radius:2px;padding:14px;margin-bottom:10px;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer;}
  .choice-btn small{display:block;font-weight:400;font-size:12.5px;color:var(--brown);margin-top:2px;}
  .choice-btn .ico{font-size:24px;}

  .plan-item .fav-btn.on{color:#d99a1e;}

  .newcat-row{display:flex;gap:8px;margin-top:8px;}
  .newcat-row input{flex:1;min-width:0;}
  .gi-link{border-bottom:1px dotted var(--brown);cursor:pointer;}
  .gi-where{display:block;font-size:12px;color:var(--herb);margin-top:2px;cursor:pointer;}
  .where-list{margin:0 0 14px;}
  .where-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;}

  .where-row small{display:block;font-size:12px;color:var(--brown);margin-top:1px;}
  .where-row em{font-style:normal;color:var(--herb);font-size:18px;}
  .gi-note{display:block;font-size:12px;color:var(--brown);margin-top:1px;}
  .gi-qty{flex:0 0 auto;max-width:42%;text-align:right;font-weight:600;color:var(--brown);line-height:1.35;padding-left:8px;}
  .gcat-head{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--herb);margin:18px 0 2px;padding-bottom:4px;border-bottom:2px solid var(--line-strong);}

  .cook-nav-btn{flex:1;padding:14px;border:1px solid rgba(237,227,208,0.35);background:none;color:var(--paper);border-radius:2px;font-size:14px;font-weight:600;}

  .cook-nav-btn.primary{background:var(--tomato);border-color:var(--tomato);}

  .store-seg{display:flex;gap:0;margin:0 0 12px;border:1px solid var(--ink);border-radius:2px;overflow:hidden;}

  .store-seg button.on{background:var(--ink);color:var(--paper);}
  .store-tag{font:inherit;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:2px;border:1px solid var(--line-strong);background:transparent;color:var(--brown);margin-left:6px;white-space:nowrap;}
  .store-tag.aldi{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .grocery-item input[type=checkbox]{-webkit-appearance:none;appearance:none;width:20px;height:20px;border:1.5px solid var(--ink);border-radius:2px;background:var(--card);display:inline-grid;place-content:center;cursor:pointer;}

  .grocery-item input[type=checkbox]:checked{background:var(--ink);}

  .np-sec h3{font-size:14px;margin:0 0 8px;}

  .np-ings{max-height:150px;overflow:auto;border:1px solid var(--line-strong);border-radius:4px;padding:4px 8px;margin:6px 0;}

  .np-chip button{border:none;background:none;font-size:16px;color:var(--brown);padding:0 4px;}
  .draft-banner{background:var(--card);border:1px dashed var(--herb);border-radius:6px;padding:9px 12px;font-size:13px;margin:10px 0;color:var(--brown);}

  .extra-seg{margin:0;flex:1;}
  .extra-seg button{padding:9px 10px;font-size:14px;}
  .fold-head{display:flex;align-items:center;gap:8px;width:100%;margin:8px 0 0;padding:10px 12px;background:var(--card);border:1px solid var(--line-strong);border-radius:4px;font:inherit;font-size:14px;color:var(--ink);text-align:left;}

  .fold-head em{font-style:normal;color:var(--brown);flex:1;}
  .fold-head b{color:var(--brown);}
  .chip-row[hidden]{display:none;}
  .fold-head + .chip-row{margin-top:8px;}
  /* cooking mode uses the same light look as the rest of the app */
  #cook-overlay{background:var(--paper);color:var(--ink);}
  #cook-overlay .cook-header{gap:10px;padding:12px 12px 8px;border-bottom:1px solid var(--line);background:var(--card);}

  #cook-overlay .cook-progress{color:var(--brown);white-space:nowrap;}

  #cook-overlay .cook-ing-row{border-top-color:var(--line);}
  #cook-overlay .cook-ing-none{color:var(--brown);}
  #cook-overlay .cook-dot{background:var(--line-strong);}
  #cook-overlay .cook-dot.active{background:var(--tomato);}
  #cook-overlay .cook-nav-btn{border-color:var(--line-strong);color:var(--ink);}

  #cook-overlay .cook-ing-row .ce button.ok,#cook-overlay .cook-edit-actions button.ok{background:var(--herb);border-color:var(--herb);color:#fff;}
  #cook-overlay .cook-edit-link{color:var(--brown);}
  #cook-overlay .cook-step-area{cursor:pointer;}
  #cook-overlay .cook-header{background:var(--ink);color:var(--paper);border-bottom:none;padding:14px 12px 14px;}
  #cook-overlay .cook-exit{color:var(--paper);}
  #cook-overlay .cook-progress{color:rgba(237,227,208,0.75);}
  #cook-overlay .cook-rt strong{font-size:19px;line-height:1.2;-webkit-line-clamp:2;}
  #cook-overlay .cook-rt small{color:rgba(237,227,208,0.72);}

  #cook-overlay .cook-edit-bar{padding:10px 20px 0;min-height:36px;flex-shrink:0;}

  .tab{font-size:13px;padding-left:2px;padding-right:2px;white-space:nowrap;}
  @media (max-width:380px){.tab{font-size:11.5px;}}
  .planner-title{font-size:22px;margin:0 0 6px;}
  .planner-lead{font-size:13.5px;color:var(--brown);line-height:1.5;margin:0 0 12px;}
  .planner-sec{margin-top:22px;border-top:1px solid var(--line-strong);padding-top:14px;}
  .planner-sec h3{font-size:14px;margin:0 0 10px;}
  .planner-row{cursor:pointer}
  .planner-row .small-btn{flex-shrink:0;margin-left:8px}
  .btn-row{display:flex;gap:8px;margin-top:8px;}
  .btn-row > button{flex:1;min-width:0;width:auto;margin-top:0;}
  .idea-btns{margin:8px 0 0;}

<script>
const TAG_COLORS = {breakfast:'var(--herb)', lunch:'var(--gold)', dinner:'var(--tomato)', snack:'var(--brown)', dessert:'var(--brown)'};
const TAG_LABELS = {breakfast:'Breakfast', lunch:'Lunch', dinner:'Dinner', snack:'Snack', dessert:'Dessert'};
const LEGACY_DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const LEGACY_MEALS = ['breakfast','lunch','dinner'];

/* ---------- STATE + NAVIGATION STACK ---------- */
const HOME_VIEW = {tab:'plan', recipeId:null};
let viewStack = [HOME_VIEW];
const currentView = () => viewStack[viewStack.length - 1];

let state = {
  recipes: {},
  plans: {},
  activePlanId: null,
  checks: {},
  searchTerm: '',
  openPlans: {},
  activeFilter: 'all',
  activeCuisine: 'all',
  customCuisines: {},
  storePrefs: {},
  draftPlan: {},
  loaded: false
};
let loadingState = false;
let deferredInstall = null;

function uid(){
  return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
}



/* ---------- FIREBASE AUTH + STORAGE (shared, Google Sign-In required) ---------- */
// The Firebase web config is NOT a secret: it only identifies the project.
// Access is protected by Google Sign-In + the Realtime Database rules (email whitelist).
const DEFAULT_FIREBASE_CONFIG = {"apiKey":"AIzaSyAAVlcygCcJXlK0LkfIh3oiEMc6sZhEVFo","authDomain":"recipe-box-oneill.firebaseapp.com","databaseURL":"https://recipe-box-oneill-default-rtdb.firebaseio.com","projectId":"recipe-box-oneill","storageBucket":"recipe-box-oneill.firebasestorage.app","messagingSenderId":"809735084570","appId":"1:809735084570:web:e6fbe32739f5a901014fa3"};
let FIREBASE_CONFIG = DEFAULT_FIREBASE_CONFIG;
try {
  const saved = JSON.parse(localStorage.getItem('recipeBoxFirebaseConfig') || 'null');
  if(saved && saved.apiKey && saved.databaseURL) FIREBASE_CONFIG = saved;
} catch(e){}
let DB_URL = FIREBASE_CONFIG.databaseURL || '';
let auth = null;

async function authedDbUrl(path){
  const base = `${DB_URL.replace(/\/$/,'')}/${path}.json`;
  const user = auth && auth.currentUser;
  if(!user) return base;
  const token = await user.getIdToken();
  return `${base}?auth=${token}`;
}
async function dbGet(path){
  const res = await fetch(await authedDbUrl(path));
  if(!res.ok) throw new Error('DB get failed: ' + res.status);
  return await res.json();
}
async function dbSet(path, value){
  const res = await fetch(await authedDbUrl(path), {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(value)});
  if(!res.ok) throw new Error('DB set failed: ' + res.status);
}
async function dbDelete(path){
  const res = await fetch(await authedDbUrl(path), {method:'DELETE'});
  if(!res.ok) throw new Error('DB delete failed: ' + res.status);
}


/* ---------- INGREDIENT CATEGORIES ----------
   Every ingredient carries a `category` (stored with the recipe in the database). New and imported
   ingredients get a best guess from their name, which can be changed in the recipe form. */
const CATEGORIES = [
  {key:'produce', label:'Fruit & veg'},
  {key:'meat',    label:'Meat, fish & alternatives'},
  {key:'dairy',   label:'Dairy & eggs'},
  {key:'bakery',  label:'Bakery'},
  {key:'pantry',  label:'Pantry'},
  {key:'spices',  label:'Herbs & spices'},
  {key:'frozen',  label:'Frozen'},
  {key:'drinks',  label:'Drinks'},
  {key:'other',   label:'Other'}
];
const CAT_KEYS = CATEGORIES.map(c => c.key);
const CAT_LABEL = Object.fromEntries(CATEGORIES.map(c => [c.key, c.label]));

function guessCategory(rawName){
  const n = String(rawName || '').toLowerCase().replace(/\([^)]*\)/g, ' ');
  const has = re => re.test(n);
  if(has(/\bfrozen\b|ice cream/)) return 'frozen';
  // things that look like another category but belong in the pantry
  if(has(/broth|\bstock\b|bouillon|coconut (milk|cream)|(almond|oat|soy|soya|rice) milk|(peanut|nut|almond|cashew) butter|tomato (paste|sauce|puree|passata)|bread ?crumbs?|\bpanko\b|baking (powder|soda)|bicarb|cream of tartar|corn ?(flour|starch|meal)|\bdried (cranberr|fig|date|apricot|raisin|fruit|mango)|raisin|sultana|\bdates?\b|vinegar|canned|tinned|\btin of\b|chickpea|lentil|kidney bean|black bean|cannellini/)) return 'pantry';
  // spices, seasonings and dried herbs
  if(has(/\bdried\b.*\b(sage|thyme|basil|parsley|oregano|rosemary|mint|dill|coriander|chives|tarragon)\b|\b(sage|thyme|basil|parsley|oregano|rosemary|mint|dill|coriander|chives|tarragon)\b.*\bdried\b/)) return 'spices';
  if(has(/\b(salt|paprika|cumin|turmeric|cinnamon|nutmeg|oregano|cayenne|allspice|cardamom|saffron|seasoning|spice|spices|curry powder|garlic powder|onion powder|(pepper|chil+i|chilli) flakes|bay leaf|bay leaves|mixed herbs|peppercorns?|garam masala|za'atar|sumac|ground (ginger|coriander|cloves|mustard|black pepper|white pepper)|ginger powder)\b/)) return 'spices';
  if(has(/\b(bell|capsicum|chil+i|jalape[nñ]o|red|green|yellow|orange)\s+peppers?\b|\bcapsicum\b/)) return 'produce';
  if(has(/\bpepper\b/)) return 'spices';
  if(has(/\b(milk|cream|yog(h)?urt|cheese|mozzarella|parmesan|cheddar|feta|ricotta|halloumi|butter|eggs?|ghee|kefir|mascarpone|paneer|cottage)\b/)) return 'dairy';
  if(has(/\b(chicken|beef|pork|lamb|bacon|sausages?|mince|turkey|ham|salmon|tuna|prawns?|shrimps?|fish|fillets?|steak|veggie ground|plant.based|vegan|tofu|tempeh|seitan|meatballs?|chorizo|salami|anchov(y|ies))\b/)) return 'meat';
  if(has(/\b(bread|buns?|rolls?|sourdough|tortillas?|wraps?|pita|naan|bagels?|croissants?|baguette|focaccia|muffins?|flatbread)\b/)) return 'bakery';
  if(has(/(apple|banana|lemon|lime\b|oranges?\b|berr(y|ies)|grapes?\b|mango|pears?\b|peach|plum|melon|pineapple|avocado|tomato|onion|shallot|leek|garlic|potato|carrot|celery|broccoli|cauliflower|spinach|arugula|rocket|lettuce|kale|cabbage|mushroom|cucumber|zucchini|courgette|squash|pumpkin|eggplant|aubergine|sweetcorn|corn on|\bcorn\b|\bpeas?\b|green beans?|asparagus|ginger|chil+i|jalape|beetroot|radish|fennel|basil|parsley|coriander|cilantro|\bmint\b|thyme|rosemary|\bdill\b|chives|\bsage\b|greens|spring mix|salad|sprouts|bok choy|cress|\bfigs?\b|herbs?\b)/)) return 'produce';
  if(has(/\b(wine|beer|soda|sparkling|kombucha|coffee|espresso|tea)\b/)) return 'drinks';
  if(has(/(oil|sauce|paste|soy|mustard|mayo|mayonnaise|honey|syrup|molasses|treacle|sugar|flour|vanilla|extract|rice|quinoa|pasta|orzo|noodle|spaghetti|couscous|\boats?\b|cereal|granola|bean|nut\b|nuts\b|almond|walnut|cashew|pecan|pistachio|peanut|seeds?\b|tahini|jam\b|cocoa|chocolate|yeast|olives?\b|capers?\b|pickle|artichoke|hummus|crumbs)/)) return 'pantry';
  if(has(/\bwater\b/)) return 'pantry';
  return 'other';
}

// Migrations fix the data in memory straight away (so the screen is right), then save only the small changed
// fields in the background. They never block start-up and never re-upload photos.
function migrateCategories(){
  const writes = [];
  Object.values(state.recipes).forEach(r=>{
    if(!CUISINE_KEYS.includes(r.cuisine)){
      r.cuisine = guessCuisine(fullTitle(r), r.ingredients);
      writes.push(dbSet('recipes/' + r.id + '/cuisine', r.cuisine));
    }
    let dirty = false;
    (Array.isArray(r.ingredients) ? r.ingredients : []).forEach(i=>{
      if(!CAT_KEYS.includes(i.category)){ i.category = guessCategory(i.name); dirty = true; }
    });
    if(dirty) writes.push(dbSet('recipes/' + r.id + '/ingredients', r.ingredients));
  });
  return writes;
}


function migrateIngredients(){
  const writes = [];
  Object.values(state.recipes).forEach(r=>{
    if(!Array.isArray(r.ingredients)) return;
    const next = r.ingredients.map(normalizeIngredient);
    if(JSON.stringify(next) !== JSON.stringify(r.ingredients)){
      r.ingredients = next;
      writes.push(dbSet('recipes/' + r.id + '/ingredients', next));
    }
  });
  return writes;
}

/* ---------- CUISINES / DISH STYLES (for finding meals in the plan builder) ---------- */
const CUISINES = [
  {key:'italian', label:'Italian'}, {key:'mexican', label:'Mexican'}, {key:'asian', label:'Asian'},
  {key:'indian', label:'Indian'}, {key:'mediterranean', label:'Mediterranean'}, {key:'middle-eastern', label:'Middle Eastern'},
  {key:'french', label:'French'}, {key:'american', label:'American'},
  {key:'salad', label:'Salad'}, {key:'soup', label:'Soup & stew'}, {key:'burgers', label:'Burgers & sandwiches'},
  {key:'recipetin', label:'Recipe Tin'},
  {key:'other', label:'Other'}

function normPlan(p){
  const ids = p.recipeIds ? (Array.isArray(p.recipeIds) ? p.recipeIds : Object.values(p.recipeIds)) : [];
  const ex = p.extras ? (Array.isArray(p.extras) ? p.extras : Object.values(p.extras)) : [];
  const legacyBuilt = ids.filter(Boolean).length > 0;
  const built = p.built === undefined ? legacyBuilt : !!p.built;
  const locked = p.locked === undefined ? built : !!p.locked;
  return {id: p.id, name: p.name || 'Meal plan', created: p.created || 0, recipeIds: ids.filter(Boolean), built, locked, groceryDone: !!p.groceryDone,
          servings: Object.fromEntries(Object.entries(p.servings || {}).map(([k,v]) => [k, Math.min(99, Math.max(1, parseInt(v) || 1))])),
          done: Object.fromEntries(Object.entries(p.done || {}).filter(([k,v]) => v).map(([k,v]) => [k, typeof v === 'number' ? v : true])),
          extras: ex.filter(x => x && x.name).map(x => ({id: String(x.id || uid()), name: String(x.name), qty: String(x.qty || ''), category: CAT_KEYS.includes(x.category) ? x.category : guessCategory(x.name)}))};
}
// times cooked / last cooked come from the meal plans: a ticked meal stores the time it was ticked
// (older ticks hold just "true", so the plan's own date stands in for them)
function cookStats(id){
  let n = 0, last = 0;
  Object.values(state.plans).forEach(p => {
    const v = p.done && p.done[id]; if(!v) return;
    n++;
    const t = typeof v === 'number' ? v : (p.created || 0);
    if(t > last) last = t;
  });
  // cooks logged from the recipe page when the meal was not in the plan
  const rc = state.recipes[id];
  adhocCooks(rc).forEach(t => { n++; if(t > last) last = t; });
  return {n, last};
}
function adhocCooks(r){ return r && r.cooks ? Object.values(r.cooks).filter(t => typeof t === 'number') : []; }
function sameDay(a, b){ return new Date(a).toDateString() === new Date(b).toDateString(); }
// is this recipe ticked as cooked right now? In the current plan it is the plan tick; otherwise a cook logged today
function cookedNow(r){
  const pl = activePlan();
  if(pl && pl.recipeIds.includes(r.id)) return !!(pl.done && pl.done[r.id]);
  return adhocCooks(r).some(t => sameDay(t, Date.now()));
}
async function toggleCooked(r){
  const pl = activePlan();
  if(pl && pl.recipeIds.includes(r.id)){
    pl.done = pl.done || {};
    if(pl.done[r.id]) delete pl.done[r.id]; else pl.done[r.id] = Date.now();
    render(); await savePlan(pl);
  } else {
    const list = adhocCooks(r);
    r.cooks = cookedNow(r) ? list.filter(t => !sameDay(t, Date.now())) : [...list, Date.now()];
    render();
    try { if(r.cooks.length) await dbSet('recipes/' + r.id + '/cooks', r.cooks); else await dbDelete('recipes/' + r.id + '/cooks'); } catch(e){ console.error('save cook failed', e); }
  }
}
function cookStatText(id){

  const ds = d ? d.toLocaleDateString('en-AU', {day:'numeric', month:'short', ...(d.getFullYear() !== new Date().getFullYear() ? {year:'numeric'} : {})}) : '';
  return 'Cooked ' + (n === 1 ? 'once' : n + ' times') + (ds ? ' · last ' + ds : '');
}
function planLabel(p){
  if(!p) return '';
  if(!p.created) return p.name || 'Meal plan';
  const d = new Date(p.created);
  let label = d.toLocaleDateString('en-AU', {weekday:'short', day:'numeric', month:'short', year:'numeric'});
  // two plans on the same day: number them in the order they were made
  const same = Object.values(state.plans).filter(q => q.created && new Date(q.created).toDateString() === d.toDateString()).sort((a,b)=>a.created-b.created);
  if(same.length > 1) label += ' (' + (same.findIndex(q => q.id === p.id) + 1) + ')';

function activePlan(){ const p = state.plans[state.activePlanId]; return (p && p.built) ? p : null; }   // the built menu shown on the Menu tab
function curDraft(){ return Object.values(state.plans).filter(p => !p.built).sort((a,b)=>(b.created||0)-(a.created||0))[0] || null; }   // the unbuilt draft shown on the Planner tab
function viewPlan(){ return currentView().tab === 'planner' ? curDraft() : activePlan(); }
function newDraft(){ const d = {id: uid(), name: '', created: Date.now(), recipeIds: [], extras: [], built: false, locked: false}; d.name = planLabel({...d, id: d.id}); state.plans[d.id] = d; return d; }
// How many people a meal is planned for, and how much to scale its quantities.
function planServings(plan, recipe){
  const base = parseInt(recipe.servings) || 1;
  const n = plan && plan.servings && plan.servings[recipe.id];
  return n ? n : base;
}
function scaleFactorFor(recipe, planArg){
  const plan = planArg || activePlan();
  if(!plan || !plan.recipeIds.includes(recipe.id)) return 1;
  return planServings(plan, recipe) / (parseInt(recipe.servings) || 1);
}
function roundMl(v){ return v >= 10 ? Math.round(v / 10) * 10 : Math.round(v * 10) / 10; }
function scaleQty(qty, unit, f){
  if(unit === 'ml'){
    const m = parseQty(qty);
    if(!isNaN(m)) return String(roundMl(m * (f || 1)));   // millilitres are shown to the nearest 10
  }
  if(!f || Math.abs(f - 1) < 1e-9) return qty;
  const n = parseQty(qty);
  if(isNaN(n)) return qty;
  const v = n * f;
  if(MASS_G[unit]) return String(v >= 10 ? Math.round(v) : Math.round(v * 10) / 10);
  return fmtFrac(v);
}

async function loadState(){
  if(loadingState) return;
  loadingState = true;
  try {
    // fetch everything at once; photos are stored apart from the recipes and load afterwards
    const grab = (path) => dbGet(path).catch(e => { console.error('load failed', path, e); return null; });
    const got = await Promise.all([grab('recipes'), grab('plans'), grab('activePlanId'), grab('checks'), grab('customCuisines'), grab('storePrefs'), grab('draftPlan')]);
    const [recData, plansData, apData, checksData] = got;
    state.customCuisines = got[4] || {}; state.storePrefs = got[5] || {}; state.draftPlan = got[6] || {};
    state.recipes = recData || {};
    applyCustomCuisines();

    // fix data in memory now; save the small changes in the background without holding up start-up
    Promise.allSettled([...migrateSubtitles(), ...migrateCategories(), ...migrateIngredients()]).then(r => { const bad = r.filter(x => x.status === 'rejected').length; if(bad) console.error('migration saves failed', bad); });

    const plans = plansData || {};
    state.plans = {};
    Object.keys(plans).forEach(id => { state.plans[id] = normPlan({...plans[id], id}); });
    state.activePlanId = apData || null;
    state.checks = checksData || {};

    if(Object.keys(state.plans).length === 0){
      // First run of the list-based meal plan: carry over anything from the old day/meal scheduler.
      let legacy = {};
      try { legacy = (await dbGet('planner')) || {}; } catch(e){ legacy = {}; }
      const ids = [];
      LEGACY_DAYS.forEach(d => LEGACY_MEALS.forEach(m => {
        const rid = legacy[d] && legacy[d][m];
        if(rid && state.recipes[rid] && !ids.includes(rid)) ids.push(rid);
      }));
      if(ids.length){
        const plan = {id: uid(), name: 'This week', created: Date.now(), recipeIds: ids, extras: [], built: false, locked: false};
        state.plans[plan.id] = plan;
        await savePlan(plan);
      }
    }
    // the older "waiting for next plan" list becomes the draft menu
    const waiting = ((state.draftPlan && state.draftPlan.recipeIds) || []).filter(id => state.recipes[id]);
    if(state.draftPlan && state.draftPlan.recipeIds){
      if(waiting.length){
        const d = curDraft() || newDraft();
        waiting.forEach(id => { if(!d.recipeIds.includes(id)) d.recipeIds.push(id); });
        await savePlan(d);
      }
      state.draftPlan = {};
      try{ await dbDelete('draftPlan'); }catch(e){}
    }
    // the Menu tab only ever shows a built menu; an unbuilt one is a draft on the Planner
    const curAp = state.plans[state.activePlanId];
    if(!curAp || !curAp.built){
      const b = Object.values(state.plans).filter(p => p.built).sort((a,b)=>(b.created||0)-(a.created||0))[0];
      state.activePlanId = b ? b.id : null;
      try{ if(b) await saveActivePlanId(); else await dbDelete('activePlanId'); }catch(e){}
    }
    state.loaded = true;
    handlePlanLink();
    render();
    state.photosPromise = loadPhotos();
  } finally {
    loadingState = false;
    if(!state.loaded) document.getElementById('app').classList.remove('booting');   // never leave the splash stuck if loading failed
  }
}

/* ---------- PHOTOS ----------
   A recipe's photo is stored under photos/<id>, apart from the recipe, so the recipe list loads quickly.
   Each recipe carries a photoRev stamp; photos are cached on the phone and only re-downloaded when the stamp changes. */
const PhotoCache = {
  db: null,
  open(){ return new Promise(res=>{ try{ const rq = indexedDB.open('recipebox-photos', 1); rq.onupgradeneeded = ()=>rq.result.createObjectStore('p', {keyPath:'id'}); rq.onsuccess = ()=>{ this.db = rq.result; res(true); }; rq.onerror = ()=>res(false); }catch(e){ res(false); } }); },
  all(){ return new Promise(res=>{ if(!this.db) return res([]); try{ const rq = this.db.transaction('p').objectStore('p').getAll(); rq.onsuccess = ()=>res(rq.result || []); rq.onerror = ()=>res([]); }catch(e){ res([]); } }); },
  put(id, rev, data){ if(!this.db) return; try{ this.db.transaction('p', 'readwrite').objectStore('p').put({id, rev, data}); }catch(e){} },
  del(id){ if(!this.db) return; try{ this.db.transaction('p', 'readwrite').objectStore('p').delete(id); }catch(e){} }
};
let renderSoonTimer = null, renderSoonTries = 0;
function renderSoon(){
  clearTimeout(renderSoonTimer);
  renderSoonTimer = setTimeout(()=>{
    const ae = document.activeElement;
    const busy = sheetIsOpen() || cookIsOpen() || (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName));
    if(busy && renderSoonTries++ < 8) return renderSoon();
    renderSoonTries = 0;
    if(!busy) render();
  }, 350);
}
async function loadPhotos(){
  await PhotoCache.open();
  const cached = await PhotoCache.all();
  const byId = Object.fromEntries(cached.map(c => [c.id, c]));
  const need = [];
  Object.values(state.recipes).forEach(r=>{
    if(r.photo) return;
    const c = byId[r.id];
    if(r.photoRev && c && c.rev === r.photoRev) r.photo = c.data; else need.push(r);
  });
  if(cached.length) renderSoon();
  let idx = 0;
  const worker = async ()=>{
    while(idx < need.length){
      const r = need[idx++];
      try {
        const d = await dbGet('photos/' + r.id);
        if(typeof d === 'string' && d){
          if(!r.photoRev){ r.photoRev = Date.now(); dbSet('recipes/' + r.id + '/photoRev', r.photoRev).catch(()=>{}); }   // repair: remember that this recipe has a stored photo
          r.photo = d; PhotoCache.put(r.id, r.photoRev, d); renderSoon();
        }
      } catch(e){ console.error('photo load failed', r.id, e); }
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
  // one-off: move photos that are still stored inside the recipe into their own place
  for(const r of Object.values(state.recipes)){
    if(r.photo && !r.photoRev){ try { await ensurePhotoStored(r); await dbSet('recipes/' + r.id + '/photoRev', r.photoRev); await dbDelete('recipes/' + r.id + '/photo'); } catch(e){ console.error('photo move failed', r.id, e); } }
  }
}
function setRecipePhoto(r, data){ r.photo = data || null; r.photoRev = null; r._photoDirty = true; }
async function ensurePhotoStored(r){
  if(r._photoDirty){
    if(r.photo){ const rev = Date.now(); await dbSet('photos/' + r.id, r.photo); r.photoRev = rev; PhotoCache.put(r.id, rev, r.photo); }
    else { await dbDelete('photos/' + r.id); r.photoRev = null; PhotoCache.del(r.id); }
    r._photoDirty = false;
  } else if(r.photo && !r.photoRev){
    const rev = Date.now(); await dbSet('photos/' + r.id, r.photo); r.photoRev = rev; PhotoCache.put(r.id, rev, r.photo);
  }
}
async function saveRecipe(recipe){
  try {
    if(Array.isArray(recipe.ingredients)) recipe.ingredients = recipe.ingredients.map(normalizeIngredient);
    await ensurePhotoStored(recipe);
    const copy = {...recipe}; delete copy.photo; delete copy._photoDirty; if(!copy.photoRev) delete copy.photoRev;
    await dbSet('recipes/' + recipe.id, copy);
  } catch(e){ console.error('save recipe failed', e); }
}
async function deleteRecipeStorage(id){ try{ await dbDelete('recipes/' + id); await dbDelete('photos/' + id); PhotoCache.del(id); }catch(e){ console.error('delete recipe failed', e); } }
async function savePlan(plan){ try{ await dbSet('plans/' + plan.id, plan); }catch(e){ console.error('save plan failed', e); } }
async function deletePlanStorage(id){ try{ await dbDelete('plans/' + id); }catch(e){ console.error('delete plan failed', e); } }
async function saveActivePlanId(){ try{ await dbSet('activePlanId', state.activePlanId); }catch(e){ console.error('save active plan failed', e); } }

function esc(s){

function resizeImage(file, maxDim=900, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('image load failed'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}

/* ---------- TITLES & SUBTITLES ----------
   A recipe has a main title ("Asian Veggie Burgers") and a smaller subtitle ("with Cucumber-Lettuce Salad, Spicy Mayo & Peanuts"). */
const SPLIT_OVERRIDES = {
  'Veggie Ground, Roasted Potato, Bell Pepper & Mushroom Frittata': ['Veggie Ground Frittata', 'with Roasted Potato, Bell Pepper & Mushroom'],
  'Black Bean, Butternut Squash & Jalapeño Enchiladas': ['Black Bean Enchiladas', 'with Butternut Squash & Jalapeño'],
  'Broccoli, Red Onion & Cottage Cheese Frittata': ['Broccoli Frittata', 'with Red Onion & Cottage Cheese'],
  'One-Pot Creamy Zucchini & Mushroom Pasta': ['One-Pot Creamy Pasta', 'with Zucchini & Mushroom']
};
function splitTitle(t){
  t = String(t || '').trim();
  if(SPLIT_OVERRIDES[t]) return SPLIT_OVERRIDES[t];
  const m = t.match(/^(.+?)\s+(with\s+.+)$/i);
  if(m && m[1].length >= 4) return [m[1].trim(), m[2].trim()];
  return [t, ''];
}
function fullTitle(r){ return r.subtitle ? r.title + ' ' + r.subtitle : r.title; }
function migrateSubtitles(){
  const writes = [];
  Object.values(state.recipes).forEach(r=>{
    if(typeof r.subtitle === 'string') return;
    const [main, sub] = splitTitle(r.title);
    r.title = main; r.subtitle = sub;
    writes.push(dbSet('recipes/' + r.id + '/title', main), dbSet('recipes/' + r.id + '/subtitle', sub));
  });
  return writes;
}
function starSvg(on){
  return `<svg class="star-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.5 5.4 5.9.7-4.4 4 1.2 5.8L12 16.2 6.8 19.1 8 13.3 3.6 9.3l5.9-.7z" fill="${on?'#f2b01e':'none'}" stroke="${on?'#c9830a':'currentColor'}" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function renderBox(){
  const recipes = Object.values(state.recipes);
  const q = (state.searchTerm || '').toLowerCase();
  const okTag = (r, f) => f==='all' || (f==='fav' ? !!r.fav : r.tag===f);
  const okCui = (r, c) => c==='all' || recipeCuisines(r).includes(c);
  const okSearch = r => !q || fullTitle(r).toLowerCase().includes(q);
  const filtered = recipes.filter(r => okTag(r, state.activeFilter) && okCui(r, state.activeCuisine) && okSearch(r)).sort((a,b)=> (b.fav?1:0) - (a.fav?1:0));   // favourites first (stable sort keeps the rest in order)
  // chip counts reflect the other filter that is on, so a number never promises recipes that won't show
  const tagCount = f => recipes.filter(r => okTag(r, f) && okCui(r, state.activeCuisine) && okSearch(r)).length;
  const cuiCount = c => recipes.filter(r => okTag(r, state.activeFilter) && okCui(r, c) && okSearch(r)).length;
  const tags = [...new Set(recipes.map(r=>r.tag))];
  const filtersOn = state.activeFilter !== 'all' || state.activeCuisine !== 'all' || !!q;

  let html = `
    <div class="search-row">
      <input type="text" id="search-input" placeholder="Search recipes…" value="${esc(state.searchTerm)}">
    </div>
    <button type="button" class="fold-head" data-act="fold" data-id="show"><span>Type</span><em>${esc(state.activeFilter==='all'?'All':state.activeFilter==='fav'?'Favourites':(TAG_LABELS[state.activeFilter]||state.activeFilter))}</em><b>${state.openFilters&&state.openFilters.show?'▾':'▸'}</b></button>
    <div class="chip-row" ${state.openFilters&&state.openFilters.show?'':'hidden'}>
      <button class="chip ${state.activeFilter==='all'?'active':''}" data-act="filter" data-id="all">All (${tagCount('all')})</button>
      <button class="chip ${state.activeFilter==='fav'?'active':''}" data-act="filter" data-id="fav">Favourites (${tagCount('fav')})</button>
      ${tags.map(t=>`<button class="chip ${state.activeFilter===t?'active':''}" data-act="filter" data-id="${esc(t)}">${esc(TAG_LABELS[t]||t)} (${tagCount(t)})</button>`).join('')}
    </div>
    <button type="button" class="fold-head" data-act="fold" data-id="cuisine"><span>Cuisine</span><em>${esc(state.activeCuisine==='all'?'Any':((CUISINES.find(c=>c.key===state.activeCuisine)||{label:state.activeCuisine}).label))}</em><b>${state.openFilters&&state.openFilters.cuisine?'▾':'▸'}</b></button>
    <div class="chip-row" ${state.openFilters&&state.openFilters.cuisine?'':'hidden'}>
      <button class="chip ${state.activeCuisine==='all'?'active':''}" data-act="cfilter" data-id="all">Any (${cuiCount('all')})</button>
      ${CUISINES.filter(c => cuiCount(c.key) > 0 || state.activeCuisine === c.key).map(c=>`<button class="chip ${state.activeCuisine===c.key?'active':''}" data-act="cfilter" data-id="${c.key}">${esc(c.label)} (${cuiCount(c.key)})</button>`).join('')}
    </div>
    ${filtersOn ? `<button class="secondary-btn" data-act="clear-filters" style="margin-top:10px;">Clear filters and search</button>` : ''}
    <button class="add-btn" data-act="add-recipe" style="margin-top:20px;margin-bottom:18px;">+ Add a recipe</button>
  `;

  if(filtered.length===0){
    html += `<div class="empty-state"><h3>No recipes here yet</h3><p>${recipes.length===0 ? 'Add your first recipe to start building your box.' : 'Nothing matches that search or filter.' + (state.activeFilter==='fav' ? ' Tap the ☆ on a recipe to make it a favourite.' : '')}</p></div>`;
  } else {
    html += `<div class="recipe-grid">`;
    filtered.forEach(r=>{
      const ingPreview = r.ingredients.slice(0,3).map(i=>i.name).join(', ') + (r.ingredients.length>3?'…':'');
      html += `
        <div class="recipe-card" data-act="open-recipe" data-id="${esc(r.id)}">
          ${favBtnHtml(r)}
          ${r.photo ? `<img src="${r.photo}" alt="" style="width:100%;height:200px;object-fit:cover;display:block;border-radius:2px 2px 0 0;margin:-16px -14px 12px;width:calc(100% + 28px);max-width:none;">` : placeholderHtml(r, 140, '2px 2px 0 0', 'margin:-16px -14px 12px;width:calc(100% + 28px);')}
          <span class="card-tag" style="background:${TAG_COLORS[r.tag]||'var(--brown)'};top:8px;">${esc(TAG_LABELS[r.tag]||r.tag)}</span>
          <h3>${esc(r.title)}</h3>
          ${r.subtitle ? `<div class="recipe-sub">${esc(r.subtitle)}</div>` : ''}
          <div class="recipe-meta">${esc(r.time)} min · serves ${esc(r.servings)}</div>
          <div class="cook-stat">${esc(cookStatText(r.id))}</div>
          <div class="recipe-ing-preview">${esc(ingPreview)}</div>
          <button type="button" class="card-next ${draftIds().includes(r.id)?'on':''}" data-act="draft-toggle" data-id="${esc(r.id)}">${draftIds().includes(r.id) ? 'In draft menu' : '+ Add to draft menu'}</button>
        </div>`;
    });
    html += `</div>`;
  }

  return html;
}

function renderRecipeDetail(id){
  const r = state.recipes[id];
  if(!r) return renderBox();
  const plan = activePlan();
  const inPlan = !!(plan && plan.recipeIds.includes(id));
  const sf = scaleFactorFor(r);
  const rtab = currentView().rtab === 'steps' ? 'steps' : 'ingredients';
  return `
    <button class="detail-back" data-act="back">Back</button>
    ${r.photo ? `<img src="${r.photo}" alt="" style="width:100%;height:290px;object-fit:cover;border-radius:4px;margin-bottom:12px;display:block;">` : placeholderHtml(r, 180, '4px', 'margin-bottom:12px;')}
    <span class="card-tag" style="position:static;display:inline-block;background:${TAG_COLORS[r.tag]||'var(--brown)'}">${esc(TAG_LABELS[r.tag]||r.tag)}</span>
    <h2 class="detail-title" style="margin-top:8px;">${esc(r.title)}</h2>
    ${r.subtitle ? `<div class="detail-sub">${esc(r.subtitle)}</div>` : ''}
    <div class="fav-line">${favBtnHtml(r, true)}</div>
    <div class="recipe-meta">${esc(r.time)} min · serves ${esc(r.servings)}${Math.abs(sf - 1) > 1e-9 ? ` · <strong>scaled for ${planServings(plan, r)}</strong>` : ''}</div>
    <div class="cook-stat">${esc(cookStatText(r.id))}</div>

    <button class="primary-btn" data-act="cook" data-id="${esc(r.id)}" style="margin:14px 0 4px;">Start cooking</button>

    <div class="rtabs">
      <button class="rtab ${rtab==='ingredients'?'active':''}" data-act="rtab" data-id="ingredients">Ingredients</button>
      <button class="rtab ${rtab==='steps'?'active':''}" data-act="rtab" data-id="steps">Steps</button>
    </div>

    ${rtab === 'ingredients' ? `
    <div class="detail-section" style="margin-top:12px;">
      <ul class="ing-list">
        ${r.ingredients.map(i=>`<li><span class="ing-nm">${esc(i.name)}</span><span class="ing-q">${esc(ingQtyText(i.qty, i.unit, sf))}</span></li>`).join('')}
      </ul>
      ${Math.abs(sf - 1) > 1e-9 ? `<p class="plan-hint">Quantities are scaled for ${planServings(plan, r)} people. Amounts written inside the steps are not changed.</p>` : ''}
    </div>` : `
    <div class="detail-section" style="margin-top:12px;">
      <ol class="steps-list">
        ${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}
      </ol>
    </div>`}

    <button class="cooked-btn ${cookedNow(r)?'on':''}" data-act="recipe-cooked" data-id="${esc(r.id)}">${cookedNow(r) ? 'Cooked ✓ (tap to undo)' : 'Cooked'}</button>

    <div class="detail-section">
      ${plan && plan.locked ? `<div class="locked-note">Your meal plan is locked. Tap "Edit plan" in Menu to change it.</div>` : ''}
      <div class="btn-row">${plan && !plan.locked ? `<button class="secondary-btn" data-act="plan-toggle" data-id="${esc(r.id)}">${inPlan ? 'In meal plan' : '+ Add to meal plan'}</button>` : ''}<button class="secondary-btn" data-act="draft-toggle" data-id="${esc(r.id)}">${draftIds().includes(r.id) ? 'In draft menu' : '+ Add to draft menu'}</button></div>
      <div class="btn-row"><button class="secondary-btn" data-act="share-recipe" data-id="${esc(r.id)}">Share as PDF</button><button class="secondary-btn" data-act="edit-recipe" data-id="${esc(r.id)}">Edit recipe</button></div>
      <button class="danger-btn" data-act="delete-recipe" data-id="${esc(r.id)}">Delete recipe</button>
    </div>
  `;
}

/* ---------- MEAL PLAN VIEW ---------- */
function thumbHtml(r, small){
  const cls = 'thumb' + (small ? ' thumb-sm' : '');
  if(r.photo) return `<img class="${cls}" src="${r.photo}" alt="" data-act="open-recipe" data-id="${esc(r.id)}">`;
  const c = r.cuisine && CUISINE_EMOJI[r.cuisine] ? r.cuisine : 'other';
  return `<div class="${cls} thumb-empty" style="background:linear-gradient(135deg,${CUISINE_GRAD[c]})" data-act="open-recipe" data-id="${esc(r.id)}">${CUISINE_EMOJI[c]}</div>`;
}

function planItemHtml(plan, r){
  const isDone = !!(plan.done && plan.done[r.id]);
  return `
        <div class="plan-item ${isDone?'done':''} ${plan.locked?'':'editing'}">
          ${favBtnHtml(r)}
          ${thumbHtml(r)}
          <div class="plan-item-main" data-act="open-recipe" data-id="${esc(r.id)}">
            <div class="plan-item-title">${esc(r.title)}</div>
            ${r.subtitle ? `<div class="plan-item-sub">${esc(r.subtitle)}</div>` : ''}
            <div class="plan-item-meta">${esc(TAG_LABELS[r.tag]||r.tag)} · ${esc(r.time)} min · recipe serves ${esc(r.servings)}</div>
            <div class="cook-stat">${esc(cookStatText(r.id))}</div>
            ${plan.locked
              ? `<div class="serv-line">Cooking for <strong>${planServings(plan, r)}</strong></div>`
              : `<div class="serv-line">Cooking for
                  <span class="stepper"><button data-act="serv-dec" data-id="${esc(r.id)}" aria-label="Fewer servings">−</button><strong>${planServings(plan, r)}</strong><button data-act="serv-inc" data-id="${esc(r.id)}" aria-label="More servings">+</button></span></div>`}
          </div>
          ${plan.locked ? '' : `<button class="plan-rm" data-act="plan-remove" data-id="${esc(r.id)}">Remove</button>`}
          ${plan.built ? `<label class="done-col"><input type="checkbox" data-act="plan-done" data-id="${esc(r.id)}" ${isDone?'checked':''} aria-label="Mark as cooked"></label>` : ''}
        </div>`;
}

function renderPlan(){
  const plans = Object.values(state.plans).sort((a,b)=>(b.created||0)-(a.created||0));
  const plan = activePlan();
  if(!plan) return `<h2 class="plan-date">Menu of the Week</h2><div class="empty-state"><h3>No menu yet</h3><p>Choose your meals in the Planner. When you build the menu it moves here and your grocery list is made.</p><button class="secondary-btn" data-act="go-planner">Go to Planner</button></div>`;
  const items = planRecipes(plan);

  const lockIcon = plan.locked
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor" fill-opacity=".15"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/></svg>`;
  const lockAct = plan.locked ? 'plan-edit' : 'plan-lock';
  let html = `
    <div class="plan-headrow">
      <div class="plan-title-line">
        <h2 class="plan-date">Menu of the Week</h2>
        <button type="button" class="lock-btn ${plan.locked?'locked':''}" data-act="${items.length || plan.locked ? lockAct : 'noop'}" aria-label="${plan.locked ? 'Plan locked. Tap to edit' : 'Plan unlocked'}">${lockIcon}</button>
      </div>
    </div>
    <div class="plan-count" style="margin-top:6px;">${items.length} meal${items.length===1?'':'s'} chosen${plan.locked ? '' : ` · <span class="plan-add-link" data-act="add-meals">+ add</span>`}</div>
  `;

  if(items.length === 0){
    html += `<div class="empty-state"><h3>No meals chosen yet</h3><p>Tap "+ add" above to choose meals for this plan. Your grocery list is built from the current plan.</p></div>`;
  } else {
    items.forEach(r=>{ html += planItemHtml(plan, r); });
  }

  if(plan.locked){
    html += `<div class="btn-row" style="margin-top:12px;"><button class="secondary-btn" data-act="go-list">See grocery list</button>${items.length ? `<button class="secondary-btn" data-act="share-plan">Share as image</button>` : ''}</div>`;
  } else {
    if(items.length){
      html += `<button class="add-btn" data-act="plan-lock" style="margin-top:12px;background:var(--tomato);">Save changes and lock plan</button>`;
      html += `<p class="plan-hint">Your grocery list is already built and updates as you change the meals.</p>`;
      html += `<div class="btn-row"><button class="secondary-btn" data-act="plan-clear">Clear all meals</button><button class="secondary-btn" data-act="share-plan">Share as image</button></div>`;
    }
  }

  const previous = plans.filter(p => p.built && p.id !== plan.id);
  if(previous.length){
    html += `<div class="plan-current-label" style="margin-top:30px;">Previous plans</div>`;
    previous.forEach(p=>{
      const open = !!state.openPlans[p.id];
      const rs = planRecipes(p);
      const n = (p.recipeIds || []).length;
      html += `
        <div class="prev-plan">
          <button class="prev-head" data-act="plan-expand" data-id="${esc(p.id)}" aria-expanded="${open}">
            <span class="prev-arrow">${open ? '▾' : '▸'}</span>
            <span class="prev-title">${esc(planLabel(p))}</span>
            <span class="prev-count">${n} meal${n===1?'':'s'}</span>
          </button>`;
      if(open){
        html += `<div class="prev-body">`;
        if(rs.length) html += rs.map(r=>`<div class="prev-meal" data-act="open-recipe" data-id="${esc(r.id)}">${thumbHtml(r, true)}<span>${esc(fullTitle(r))}</span></div>`).join('');
        else html += `<div class="prev-empty">No meals in this plan.</div>`;
        if((p.extras || []).length) html += `<div class="prev-extras">Plus: ${(p.extras || []).map(x=>esc(x.name)).join(', ')}</div>`;
        html += `<div class="prev-actions">
            <button class="small-btn" data-act="plan-activate" data-id="${esc(p.id)}">Make this the current plan</button>
            <button class="small-btn prev-del" data-act="plan-delete-id" data-id="${esc(p.id)}">Delete</button>
          </div></div>`;
      }
      html += `</div>`;
    });
  }
  return html;
}

async function togglePlanRecipe(rid, planArg){
  const plan = planArg || viewPlan();
  if(!plan || plan.locked) return;
  const i = plan.recipeIds.indexOf(rid);
  if(i >= 0){ plan.recipeIds.splice(i, 1); if(plan.servings) delete plan.servings[rid]; } else plan.recipeIds.push(rid);
  render();
  await savePlan(plan);
}

function draftIds(){ const d = curDraft(); return d ? d.recipeIds.filter(id => state.recipes[id]) : []; }
async function toggleDraft(id){
  const d = curDraft() || newDraft();
  const i = d.recipeIds.indexOf(id);
  if(i >= 0){ d.recipeIds.splice(i,1); if(d.servings) delete d.servings[id]; showToast('Removed from your draft menu'); } else { d.recipeIds.push(id); showToast('Added to your draft menu'); }
  render();
  await savePlan(d);
}

function openNewPlanSheet(){
  const old = activePlan();
  const drafts = draftIds();
  const uncooked = old ? old.recipeIds.filter(id => state.recipes[id] && !(old.done && old.done[id])) : [];
  const recipes = Object.values(state.recipes);
  const tags = CUISINES.map(c=>c.key).filter(t => recipes.some(r => recipeCuisines(r).includes(t)));
  const cuiLabel = t => (CUISINES.find(c=>c.key===t)||{label:t}).label;
  const sel = new Set(drafts);          // meals chosen for the new plan (starts with the "add to next plan" ones)
  const sugg = {};                      // cuisine -> recipe ids picked by the random suggester
  const openCu = new Set();
  let carryOn = false, carryMode = 'none';
  const skip = new Set();
  let carriedItems = [];
  if(uncooked.length){
    carriedItems = buildGroceryList({recipeIds: uncooked, servings: old.servings || {}, carried: [], built: true});
    carriedItems.forEach(it => skip.add(it.key));   // every grocery starts unticked; tick the ones you need
  }
  function body(){
    let h = `<div class="sheet-handle"></div><h2>Start a new meal plan</h2>
      <p style="font-size:13px;color:var(--brown);line-height:1.5;margin:0 0 6px;">This starts a draft menu in the Planner. Your current menu and grocery list stay as they are until you build the draft.</p>`;
    h += `<div class="btn-row"><button type="button" class="secondary-btn" id="np-fridge">What's in my fridge?</button><button type="button" class="secondary-btn" id="np-again">Cook again</button></div>`;
    if(sel.size){
      h += `<div class="np-sec"><h3>Chosen for the new plan (${sel.size})</h3>${Array.from(sel).filter(id=>state.recipes[id]).map(id=>`<span class="np-chip">${esc(state.recipes[id].title)}<button type="button" data-np-pick="${esc(id)}" aria-label="Remove">×</button></span>`).join('')}${drafts.length?`<div style="font-size:12px;color:var(--brown)">Meals already in your draft menu are here.</div>`:''}</div>`;
    }
    if(uncooked.length){
      h += `<div class="np-sec"><label class="np-opt"><input type="checkbox" id="np-carry" ${carryOn?'checked':''}><span>Include the ${uncooked.length} meal${uncooked.length===1?'':'s'} not cooked yet from the current plan<br><small style="color:var(--brown)">${uncooked.map(id=>esc(state.recipes[id].title)).join(', ')}</small></span></label>`;
      if(carryOn){
        h += `<label class="np-opt"><input type="radio" name="np-cm" value="none" ${carryMode==='none'?'checked':''}><span>No groceries needed, I already have them</span></label>
              <label class="np-opt"><input type="radio" name="np-cm" value="choose" ${carryMode==='choose'?'checked':''}><span>Choose which groceries to add</span></label>`;
        if(carryMode === 'choose'){
          h += `<div class="np-ings">${carriedItems.map(it=>`<label class="np-opt"><input type="checkbox" data-np-ing="${esc(it.key)}" ${skip.has(it.key)?'':'checked'}><span>${esc(it.name)} <small style="color:var(--brown)">${esc(it.qtyText)}</small></span></label>`).join('')}</div><div style="font-size:12px;color:var(--brown)">Ticked items go on the grocery list.</div>`;
        }
      }
      h += `</div>`;
    }
    if(tags.length){
      h += `<div class="np-sec"><h3>Choose meals by cuisine</h3><div style="font-size:12px;color:var(--brown);margin-bottom:4px;">Tap a cuisine to open it and pick meals, or use + to have a random one suggested. Suggestions appear at the top of the list.</div>`;
      tags.forEach(t=>{
        const list = recipes.filter(r => recipeCuisines(r).includes(t));
        const nSel = list.filter(r => sel.has(r.id)).length;
        const isOpen = openCu.has(t);
        h += `<div class="np-cu"><div class="np-row"><span class="np-cu-head" data-np-tog="${t}">${isOpen?'▾':'▸'} ${esc(cuiLabel(t))} <small style="color:var(--brown)">(${list.length})${nSel?` · <strong>${nSel} chosen</strong>`:''}</small></span><span class="stepper"><button type="button" data-np-dec="${t}" aria-label="Remove a suggestion">−</button><strong>${(sugg[t]||[]).length}</strong><button type="button" data-np-inc="${t}" aria-label="Suggest one more">+</button></span></div>`;
        if(isOpen){
          const rank = r => (sugg[t]||[]).includes(r.id) ? 0 : (sel.has(r.id) ? 1 : 2);
          const sorted = list.slice().sort((a,b)=> rank(a)-rank(b) || a.title.localeCompare(b.title));
          h += `<div class="np-list">${sorted.map(r=>`<div class="np-recipe ${sel.has(r.id)?'on':''}" data-np-pick="${esc(r.id)}"><span>${(sugg[t]||[]).includes(r.id)?'🎲 ':''}${esc(r.title)}${r.subtitle?`<em class="pick-sub">${esc(r.subtitle)}</em>`:''}</span><b>${sel.has(r.id)?'✓':'+'}</b></div>`).join('')}</div>`;
        }
        h += `</div>`;
      });
      h += `</div>`;
    }
    h += `<div class="btn-row" style="margin-top:12px;"><button class="primary-btn" id="np-create">Start draft</button><button class="secondary-btn" id="np-cancel">Cancel</button></div>`;
    return h;
  }
  function draw(){
    const sc = document.querySelector('.sheet'); const top = sc ? sc.scrollTop : 0;
    openSheet(body());
    const sc2 = document.querySelector('.sheet'); if(sc2) sc2.scrollTop = top;
    document.getElementById('np-cancel').onclick = closeSheet;
    document.getElementById('np-fridge').onclick = ()=>{ ideasState.fromPlanner = false; openIdeasSheet('fridge', true); };
    document.getElementById('np-again').onclick = ()=>{ ideasState.fromPlanner = false; openIdeasSheet('again', true); };
    const c = document.getElementById('np-carry');
    if(c) c.onchange = ()=>{ carryOn = c.checked; draw(); };
    document.querySelectorAll('input[name=np-cm]').forEach(r => r.onchange = ()=>{ carryMode = r.value; draw(); });
    document.querySelectorAll('[data-np-ing]').forEach(x => x.onchange = ()=>{ if(x.checked) skip.delete(x.dataset.npIng); else skip.add(x.dataset.npIng); });
    document.querySelectorAll('[data-np-tog]').forEach(b => b.onclick = ()=>{ const t=b.dataset.npTog; if(openCu.has(t)) openCu.delete(t); else openCu.add(t); draw(); });
    document.querySelectorAll('[data-np-pick]').forEach(b => b.onclick = ()=>{ const id=b.dataset.npPick; if(sel.has(id)){ sel.delete(id); Object.keys(sugg).forEach(k=>{ sugg[k] = sugg[k].filter(x=>x!==id); }); } else sel.add(id); draw(); });
    document.querySelectorAll('[data-np-inc]').forEach(b => b.onclick = ()=>{
      const t=b.dataset.npInc;
      const pool = recipes.filter(r => recipeCuisines(r).includes(t) && !sel.has(r.id));
      if(!pool.length){ showToast('No more ' + cuiLabel(t) + ' recipes to suggest'); return; }
      const pick = pool[Math.floor(Math.random()*pool.length)];
      sel.add(pick.id); (sugg[t] = sugg[t] || []).unshift(pick.id); openCu.add(t); draw();
    });
    document.querySelectorAll('[data-np-dec]').forEach(b => b.onclick = ()=>{ const t=b.dataset.npDec; const l = sugg[t]||[]; if(!l.length) return; const id = l.shift(); sel.delete(id); draw(); });
    document.getElementById('np-create').onclick = create;
  }
  async function create(){
    const plan = {id: uid(), name: '', created: Date.now(), recipeIds: [], extras: [], built: false, locked: false};
    plan.name = planLabel({...plan});
    if(carryOn && uncooked.length){
      plan.recipeIds.push(...uncooked);
      plan.carried = uncooked.slice();
      plan.carryMode = carryMode;
      if(carryMode === 'choose') plan.skipIng = Array.from(skip);
      plan.servings = {};
      uncooked.forEach(id => { if(old.servings && old.servings[id]) plan.servings[id] = old.servings[id]; });
      if(!Object.keys(plan.servings).length) delete plan.servings;
    }
    sel.forEach(id => { if(state.recipes[id] && !plan.recipeIds.includes(id)) plan.recipeIds.push(id); });
    const prevDraft = curDraft();
    if(prevDraft){
      // the new draft replaces the old one; keep any serving counts already set
      prevDraft.recipeIds.forEach(id => { if(plan.recipeIds.includes(id) && prevDraft.servings && prevDraft.servings[id]){ plan.servings = plan.servings || {}; if(!plan.servings[id]) plan.servings[id] = prevDraft.servings[id]; } });
      delete state.plans[prevDraft.id];
    }
    state.plans[plan.id] = plan;
    closeSheet();
    goTab('planner');
    if(!plan.recipeIds.length) openMealPicker();
    else showToast(plan.recipeIds.length + ' meal' + (plan.recipeIds.length===1?'':'s') + ' in your draft menu.');
    await savePlan(plan);
    if(prevDraft) await deletePlanStorage(prevDraft.id);
  }
  draw();
}

let ideasState = {tab:'fridge', terms:[]};
try{ ideasState.terms = JSON.parse(localStorage.getItem('rb_fridge')||'[]'); }catch(e){}
function fridgeTokens(txt){ return normIngName(txt).split(/\s+/).filter(Boolean).map(w=>singularWord(w)); }
function fridgeMatches(){
  const terms = ideasState.terms.map(t=>({t, tok: fridgeTokens(t)})).filter(x=>x.tok.length);
  if(!terms.length) return [];
  const out = [];
  Object.values(state.recipes).forEach(r=>{
    const ingToks = (r.ingredients||[]).map(i=>({name:i.name, tok: fridgeTokens(i.name||'')}));
    const hit = [];
    terms.forEach(x=>{
      if(ingToks.some(it => x.tok.every(w => it.tok.includes(w)))) hit.push(x.t);
    });
    if(hit.length) out.push({r, hit, total: (r.ingredients||[]).length});
  });
  return out.sort((a,b)=> b.hit.length - a.hit.length || (a.total - b.total) || a.r.title.localeCompare(b.r.title)).slice(0, 10);
}
function lastWeekItems(){
  const prev = Object.values(state.plans).filter(p => p.built && (ideasState.forNew ? true : p.id !== state.activePlanId)).sort((a,b)=>(b.created||0)-(a.created||0));
  const plan = ideasState.forNew ? activePlan() : prev[0];
  if(!plan || !plan.recipeIds.length) return {plan:null, items:[]};
  const items = buildGroceryList({recipeIds: plan.recipeIds, servings: plan.servings || {}, carried: [], built: true}).filter(it => it.cat !== 'pantry' && it.cat !== 'spices');
  return {plan, items};
}
